name: PTX Build & Release

on:
  push:
    tags:
      - 'vPTX-*'

jobs:
  build-ptx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install CUDA
        run: sudo apt-get install -y nvidia-cuda-toolkit
      - name: Compile PTX
        run: nvcc -ptx src/kernel.cu -o build/kernel.ptx
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ptx-binaries
          path: build/*.ptx

  release:
    needs: build-ptx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: ptx-binaries
          path: release/
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.ptx
