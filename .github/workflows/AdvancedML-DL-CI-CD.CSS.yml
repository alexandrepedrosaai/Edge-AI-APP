name: CI CD CSS Build & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build directory
        run: |
          mkdir -p dist
          if [ ! -f CSS/edge-ai-app.css ]; then
            echo "CSS/edge-ai-app.css not found!"
            exit 1
          fi
          cp CSS/edge-ai-app.css dist/edge-ai-app.css

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-css
          path: dist/edge-ai-app.css

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-ai-css
          path: release

      - name: Generate Unique Tag and Release Name
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          TAG="css-v${TIMESTAMP}-${SHORT_SHA}"
          RELEASE_NAME="CSS Release ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            🚀 Automated CSS build and release.
            
            **Release Details:**
            - **Commit:** ${{ github.sha }}
            - **Run ID:** ${{ github.run_id }}
            - **Timestamp:** $(date)
            
            This release was automatically generated for commit ${{ github.sha }} to ensure artifact isolation.
          files: release/edge-ai-app.css
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-ai-css
          path: dist

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
