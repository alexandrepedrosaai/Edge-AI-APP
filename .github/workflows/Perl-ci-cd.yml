name: CI/CD Perl Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: edge-ai-kotlin
      REGISTRY: dockerhub.io/edge-ai
      VERSION: 1.0.${{ github.run_number }}

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Perl
      run: sudo apt-get update && sudo apt-get install -y perl

    - name: Build Artifacts with Perl
      run: perl ci_cd.pl

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-${{ env.VERSION }}
        path: artifacts/${{ env.APP_NAME }}-${{ env.VERSION }}.jar

    - name: Create Automated Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION }}
        files: artifacts/${{ env.APP_NAME }}-${{ env.VERSION }}.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
