name: EdgeAi Scala CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Scala
      uses: coursier/setup-action@v1
      with:
        jvm: temurin:17
        apps: sbt

    - name: Compile Scala project
      run: |
        cd Scala
        sbt clean compile

    - name: Package JAR
      run: |
        cd Scala
        sbt package

    - name: Package JAR
      run: |
        cd Scala
        sbt package

    - name: Generate Build Document (.D)
      run: |
        echo "# EdgeAiBuild.D" > EdgeAiBuild.D
        # ... (other echo commands)
        sha256sum Scala/target/scala-2.13/edgeaiapp_2.13-0.1.jar >> EdgeAiBuild.D

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: edge-ai-scala-jar
        path: Scala/target/scala-2.13/edgeaiapp_2.13-0.1.jar


    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: edge-ai-scala-jar
        path: target/scala-*/EdgeAIAPP*.jar

    - name: Upload Build Document
      uses: actions/upload-artifact@v4
      with:
        name: edge-ai-build-doc
        path: EdgeAiBuild.D

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: edge-ai-scala-jar
        path: ./release

    - name: Download Build Document
      uses: actions/download-artifact@v4
      with:
        name: edge-ai-build-doc
        path: ./release

    - name: Generate Release Document (.D)
      run: |
        echo "# EdgeAiRelease.D" > EdgeAiRelease.D
        echo "Automated Release Document" >> EdgeAiRelease.D
        echo "Version: v${{ github.run_number }}" >> EdgeAiRelease.D
        echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> EdgeAiRelease.D
        echo "Attached Files: JAR + EdgeAiBuild.D" >> EdgeAiRelease.D
        echo "Duality:" >> EdgeAiRelease.D
        echo "- Public registry: GitHub Release" >> EdgeAiRelease.D
        echo "- Private palace: Azure execution" >> EdgeAiRelease.D

    - name: Create automated release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: "EdgeAi Scala Release ${{ github.run_number }}"
        body: |
          🚀 Automated release generated by Scala CI/CD pipeline
          - Binary JAR artifact included
          - Build Document (.D) attached
          - Release Document (.D) attached
        files: ./release/**
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
