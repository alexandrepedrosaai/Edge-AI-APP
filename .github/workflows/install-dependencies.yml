name: Install & Verify Dependencies

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/install-dependencies.yml'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  VITE_ANALYTICS_ENDPOINT: "https://analytics.example.com"
  VITE_ANALYTICS_WEBSITE_ID: "default"
  VITE_APP_TITLE: "Edge AI App"
  VITE_APP_LOGO: "/logo.svg"

jobs:
  dependencies:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
        python-version: ['3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          echo "Installing system dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            python3-dev \
            python3-pip \
            curl \
            wget \
            git \
            nasm \
            yasm \
            binutils \
            gcc \
            g++ \
            gdb \
            lldb \
            clang \
            lld \
            strace \
            ltrace \
            valgrind \
            checksec \
            jq || true
          echo "System dependencies installed"
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install Node.js dependencies
        if: hashFiles('package.json') != ''
        run: |
          echo "Installing Node.js dependencies..."
          if [ -f "pnpm-lock.yaml" ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
          pnpm list --depth=0 || true
      
      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: |
          echo "Installing Python dependencies..."
          python3 -m pip install --upgrade pip setuptools wheel -q
          pip install -r requirements.txt -q
          pip list || true
      
      - name: Verify Assembly tools
        run: |
          echo "=== Assembly Tools ==="
          nasm --version || echo "NASM not available"
          yasm --version || echo "YASM not available"
          gcc --version | head -1 || echo "GCC not available"
          gdb --version | head -1 || echo "GDB not available"
          checksec --version || echo "Checksec not available"
      
      - name: Verify Node.js tools
        run: |
          echo "=== Node.js Tools ==="
          node --version
          npm --version
          pnpm --version
      
      - name: Verify Python tools
        run: |
          echo "=== Python Tools ==="
          python3 --version
          pip --version
      
      - name: Generate dependency report
        run: |
          cat > dependency-report.md << 'EOF'
          # Dependency Installation Report
          
          Generated: $(date)
          
          ## System Dependencies
          - Node.js: $(node --version)
          - Python: $(python3 --version)
          - npm: $(npm --version)
          - pnpm: $(pnpm --version)
          
          ## Assembly Tools
          - NASM: $(nasm --version 2>&1 | head -1 || echo "Not available")
          - YASM: $(yasm --version 2>&1 | head -1 || echo "Not available")
          - GCC: $(gcc --version 2>&1 | head -1 || echo "Not available")
          - GDB: $(gdb --version 2>&1 | head -1 || echo "Not available")
          
          ## Node.js Dependencies
          $([ -f package.json ] && (pnpm list --depth=0 2>/dev/null || echo "No dependencies") || echo "No package.json found")
          
          ## Python Dependencies
          $([ -f requirements.txt ] && (pip list 2>/dev/null || echo "No dependencies") || echo "No requirements.txt found")
          
          EOF
          cat dependency-report.md
      
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report-node${{ matrix.node-version }}-py${{ matrix.python-version }}
          path: dependency-report.md
          retention-days: 30
      
      - name: Create summary
        if: always()
        run: |
          echo "# Dependency Installation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Environment" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "- Python: $(python3 --version)" >> $GITHUB_STEP_SUMMARY
          echo "- pnpm: $(pnpm --version)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status" >> $GITHUB_STEP_SUMMARY
          echo "✓ All dependencies installed successfully" >> $GITHUB_STEP_SUMMARY
