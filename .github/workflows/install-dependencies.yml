name: Install & Verify Dependencies

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/install-dependencies.yml'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dependencies:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
        python-version: ['3.9', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          echo "Installing system dependencies..."
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            python3-pip \
            curl \
            wget \
            git \
            nasm \
            yasm \
            binutils \
            gcc \
            g++ \
            gdb \
            lldb \
            clang \
            lld \
            strace \
            ltrace \
            valgrind \
            checksec \
            jq
          echo "System dependencies installed"
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version
      
      - name: Install Node.js dependencies
        if: hashFiles('package.json') != ''
        run: |
          echo "Installing Node.js dependencies..."
          pnpm install --frozen-lockfile || pnpm install
          pnpm list --depth=0
      
      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: |
          echo "Installing Python dependencies..."
          python3 -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip list
      
      - name: Verify Assembly tools
        run: |
          echo "=== Assembly Tools ==="
          nasm --version
          yasm --version
          gcc --version
          gdb --version
          checksec --version
      
      - name: Verify Node.js tools
        run: |
          echo "=== Node.js Tools ==="
          node --version
          npm --version
          pnpm --version
      
      - name: Verify Python tools
        run: |
          echo "=== Python Tools ==="
          python3 --version
          pip --version
      
      - name: Build project (if applicable)
        run: |
          if [ -f "package.json" ]; then
            echo "Building Node.js project..."
            pnpm run build || true
          fi
      
      - name: Run tests (if applicable)
        run: |
          if [ -f "package.json" ]; then
            echo "Running tests..."
            pnpm run test || true
          fi
      
      - name: Lint code (if applicable)
        run: |
          if [ -f "package.json" ]; then
            echo "Linting code..."
            pnpm run lint || true
          fi
      
      - name: Generate dependency report
        run: |
          cat > dependency-report.md << 'EOF'
          # Dependency Installation Report
          
          Generated: $(date)
          
          ## System Dependencies
          - Node.js: $(node --version)
          - Python: $(python3 --version)
          - npm: $(npm --version)
          - pnpm: $(pnpm --version)
          
          ## Assembly Tools
          - NASM: $(nasm --version 2>&1 | head -1)
          - YASM: $(yasm --version 2>&1 | head -1)
          - GCC: $(gcc --version 2>&1 | head -1)
          - GDB: $(gdb --version 2>&1 | head -1)
          
          ## Node.js Dependencies
          $([ -f package.json ] && pnpm list --depth=0 || echo "No package.json found")
          
          ## Python Dependencies
          $([ -f requirements.txt ] && pip list || echo "No requirements.txt found")
          
          EOF
          cat dependency-report.md
      
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report-node${{ matrix.node-version }}-py${{ matrix.python-version }}
          path: dependency-report.md
          retention-days: 30
      
      - name: Create summary
        if: always()
        run: |
          echo "# Dependency Installation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Environment" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "- Python: $(python3 --version)" >> $GITHUB_STEP_SUMMARY
          echo "- pnpm: $(pnpm --version)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status" >> $GITHUB_STEP_SUMMARY
          echo "✓ All dependencies installed successfully" >> $GITHUB_STEP_SUMMARY
