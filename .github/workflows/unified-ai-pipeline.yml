name: Unified Quantum-ASM AI Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm wabt
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          echo "source $(pwd)/emsdk_env.sh" >> $GITHUB_ENV

      - name: Build ASM to WASM (from asm_pipeline)
        run: |
          source emsdk/emsdk_env.sh
          mkdir -p WEBASSEMBLY
          cd asm_pipeline
          for file in *.asm; do
            filename=$(basename "$file" .asm)
            echo "Compiling $file..."
            nasm -f elf64 "$file" -o "${filename}.o"
            # Link to WASM
            emcc "${filename}.o" -o "../WEBASSEMBLY/${filename}.wasm" -s STANDALONE_WASM --no-entry || echo "Warning: $filename failed"
          done

      - name: Process WAT files in WEBASSEMBLY
        run: |
          cd WEBASSEMBLY
          for file in *.wat; do
            filename=$(basename "$file" .wat)
            echo "Assembling $file..."
            wat2wasm "$file" -o "${filename}.wasm" || echo "Warning: $file failed"
          done

      - name: Generate Unified Neural Model (.sm)
        run: |
          echo "Generating Unified Neural Model..."
          cd WEBASSEMBLY
          # Create a JSON manifest of all .wasm files
          WASM_LIST=$(ls *.wasm | xargs -n 1 basename | sed 's/\(.*\)/"\1"/' | paste -sd "," -)
          cat > NeuralModel.sm <<EOF
          {
            "model_name": "Quantum-ASM-Neural-Model",
            "version": "$(date +%Y%m%d%H%M%S)",
            "components": [
              $WASM_LIST
            ],
            "metadata": {
              "type": "Dynamic-Build-Deploy",
              "platform": "Edge-AI",
              "source": "asm_pipeline & WEBASSEMBLY/wat"
            }
          }
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Create Web Dashboard
        run: |
          mkdir -p public
          cp WEBASSEMBLY/* public/
          cat > public/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <title>Edge-AI Dynamic Dashboard</title>
            <style>
              body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 40px; line-height: 1.6; }
              .container { max-width: 900px; margin: auto; }
              .card { background: #1e1e1e; padding: 25px; margin: 20px 0; border-radius: 12px; border: 1px solid #333; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
              h1 { color: #00ffcc; border-bottom: 2px solid #00ffcc; padding-bottom: 10px; }
              h3 { color: #00ccff; margin-top: 0; }
              .status { color: #33ff77; font-weight: bold; }
              ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
              li { background: #2a2a2a; padding: 10px; border-radius: 6px; transition: transform 0.2s; }
              li:hover { transform: translateY(-3px); background: #333; }
              a { color: #00ffcc; text-decoration: none; font-size: 0.9em; word-break: break-all; }
              .footer { margin-top: 50px; font-size: 0.8em; color: #666; text-align: center; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Edge-AI Quantum-ASM Pipeline</h1>
              <div class="card">
                <h3>System Status: <span class="status">Operational</span></h3>
                <p><strong>Last Build:</strong> $(date)</p>
                <p><strong>Commit SHA:</strong> <code style="color: #ffcc00;">${{ github.sha }}</code></p>
              </div>
              <div class="card">
                <h3>Compiled Neural Model (.sm)</h3>
                <p><a href="NeuralModel.sm" style="font-size: 1.2em; font-weight: bold;">📦 Download NeuralModel.sm</a></p>
              </div>
              <div class="card">
                <h3>WASM Components (from asm_pipeline & wat)</h3>
                <ul>
                  $(ls WEBASSEMBLY/*.wasm | xargs -n 1 basename | sed 's|.*|<li><a href="\0">📄 \0</a></li>|')
                </ul>
              </div>
              <div class="footer">
                Generated by GitHub Actions for alexandrepedrosaai/Edge-AI-APP
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit and Push to WEBASSEMBLY folder
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add WEBASSEMBLY/
          git commit -m "Automated build: Sync asm_pipeline to WEBASSEMBLY [skip ci]" || echo "No changes to commit"
          git push origin main
