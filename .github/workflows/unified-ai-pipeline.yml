name: Unified Edge-AI Pipeline (Build, Deploy & Release)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-unified"
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm wabt

      - name: Build ASM to WASM
        run: |
          mkdir -p docs
          if [ -d "asm_pipeline" ]; then
            echo "Skipping ASM to WASM build: nasm -f elf64 produces ELF64 objects, which Emscripten cannot link into WebAssembly."
            echo "Granular WAT to WASM artifacts will continue to be generated from WEBASSEMBLY/."
          else
            echo "asm_pipeline directory not present; skipping ASM to WASM build."
          fi

      - name: Granular WAT to WASM Build
        run: |
          mkdir -p docs
          if [ -d "WEBASSEMBLY" ]; then
            cd WEBASSEMBLY
            # Core functions list
            functions=("Functions" "Linear" "Matrixderivate" "Hyperbolic" "Factor" "Unified" "AdvancedLinear" "Ratio")
            for func in "${functions[@]}"; do
              if [ -f "${func}.wat" ]; then
                echo "🚀 Compiling Granular Module: ${func}.wat"
                wat2wasm "${func}.wat" -o "../docs/${func}.wasm"
              fi
            done
            # Other WAT files
            for file in *.wat; do
              base=$(basename "$file" .wat)
              if [[ ! " ${functions[@]} " =~ " ${base} " ]]; then
                echo "📦 Compiling Additional Module: $file"
                wat2wasm "$file" -o "../docs/${base}.wasm"
              fi
            done
          fi

      - name: Generate Neural Model Manifest (.sm)
        run: |
          cd docs
          WASM_LIST=$(ls *.wasm | xargs -n 1 basename | sed 's/\(.*\)/"\1"/' | paste -sd "," -)
          cat > NeuralModel.sm <<EOF
          {
            "model_name": "Quantum-ASM-3D-Neural-Model",
            "version": "$(date +%Y%m%d%H%M%S)",
            "components": [ $WASM_LIST ],
            "metadata": { "type": "3D-Dynamic-Edge-AI" }
          }
          EOF

      - name: Patch index.html Visualization
        run: |
          echo "🛠️ Patching visualization settings..."
          if [ -f "docs/index.html" ]; then
            # Ensure ideal zoom
            sed -i 's/zoom = -[0-9.]\+/zoom = -3.5/g' docs/index.html
            # Ensure rotation limits (clamping)
            if ! grep -q "const limit = Math.PI / 2 - 0.1" docs/index.html; then
              sed -i 's/rotX += (e.clientY - lastY) \* 0.01;/rotX += (e.clientY - lastY) * 0.01; const limit = Math.PI \/ 2 - 0.1; if (rotX > limit) rotX = limit; if (rotX < -limit) rotX = -limit;/g' docs/index.html
            fi
            echo "✅ Patch applied to index.html."
          else
            echo "⚠️ docs/index.html not found."
          fi

      - name: Verify Documentation Structure
        run: |
          echo "🔍 Checking documentation structure..."
          mkdir -p docs/assets/css docs/assets/js
          touch docs/.nojekyll
          echo "Documentation structure verified!"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-v${{ github.run_number }}
          name: Edge-AI Neural Build v${{ github.run_number }}
          files: |
            docs/*.wasm
            docs/index.html
            docs/NeuralModel.sm
          body: |
            🚀 **Automated Edge-AI Unified Pipeline**
            ✅ WebAssembly modules compiled and deployed.
            🔗 **Live App:** ${{ steps.deployment.outputs.page_url }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
