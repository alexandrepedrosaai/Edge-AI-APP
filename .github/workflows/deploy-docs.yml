name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify documentation structure
        run: |
          echo "Checking documentation structure..."
          test -f docs/index.html || { echo "Missing docs/index.html"; exit 1; }
          test -f docs/setup.html || { echo "Missing docs/setup.html"; exit 1; }
          test -f docs/releases.html || { echo "Missing docs/releases.html"; exit 1; }
          test -f docs/structure.html || { echo "Missing docs/structure.html"; exit 1; }
          test -f docs/assets/css/styles.css || { echo "Missing docs/assets/css/styles.css"; exit 1; }
          test -f docs/assets/js/main.js || { echo "Missing docs/assets/js/main.js"; exit 1; }
          echo "Documentation structure verified!"

      - name: Create .nojekyll file
        run: touch docs/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create deployment notification
        run: |
          echo "✅ Documentation deployed successfully!"
          echo "📖 Site URL: ${{ steps.deployment.outputs.page_url }}"
