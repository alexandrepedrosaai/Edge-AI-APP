name: CI-CD Matrix-OS-ISA Macro Assembler Automated Releases

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macro-asm:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        isa: [x86, arm, riscv]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Assembler Environment (Linux/macOS)
        if: runner.os != 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nasm gcc || true

      - name: Setup Assembler Environment (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y

      - name: Assemble Macro Code
        run: |
          set -euo pipefail
          mkdir -p build/macro/${{ matrix.isa }}
          mapfile -t SRCS < <(find src/macro -type f -name '*.asm' || true)

          if [ "${#SRCS[@]}" -eq 0 ]; then
            echo "No macro assembler sources found. Expected src/macro/*.asm"
            exit 1
          fi

          for src in "${SRCS[@]}"; do
            out="build/macro/${{ matrix.isa }}/$(basename "${src}" .asm)-${{ matrix.isa }}.bin"
            nasm -f bin "$src" -o "$out"
            sha256sum "$out" > "$out.sha256"
          done

      - name: Upload Macro Assembler Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macro-${{ matrix.os }}-${{ matrix.isa }}
          path: build/macro/${{ matrix.isa }}/*

  release:
    needs: build-macro-asm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Manifest JSON
        run: |
          echo "[" > manifest.json
          for f in $(find ./artifacts -name '*.bin'); do
            HASH=$(sha256sum "$f" | cut -d ' ' -f1)
            SIZE=$(stat -c%s "$f")
            OSISA=$(basename $(dirname "$f"))
            echo "  {\"file\":\"$(basename $f)\",\"osisa\":\"$OSISA\",\"size\":$SIZE,\"sha256\":\"$HASH\"}," >> manifest.json
          done
          sed -i '$ s/,$//' manifest.json
          echo "]" >> manifest.json

      - name: Create Tag for Release
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-run${{ github.run_number }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Macro Assembler Matrix Release ${{ steps.tag.outputs.tag }}"
          body: |
            Automated multi-OS / multi-ISA macro assembler release.
            Includes SHA256 hashes and manifest.json for integrity verification.
            Commit: ${{ github.sha }}
          files: |
            ./artifacts/**/*
            manifest.json
