name: CI-CD Matrix-OS-ISA Macro Assembler Automated Releases

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macro-asm:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        isa: [x86, arm, riscv]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Assembler Environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc

      - name: Setup Assembler Environment (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nasm

      - name: Setup Assembler Environment (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y

      - name: Assemble Macro Code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/macro/${{ matrix.isa }}

          # Filtra os arquivos por arquitetura para evitar erros de instrução não suportada
          # x86 -> main_x86.asm, arm -> main_arm.asm, riscv -> main_riscv.asm
          case "${{ matrix.isa }}" in
            x86)   pattern="*x86.asm" ;;
            arm)   pattern="*arm.asm" ;;
            riscv) pattern="*riscv.asm" ;;
            *)     pattern="*.asm" ;;
          esac

          found=0
          while IFS= read -r -d '' src; do
            found=1
            out="build/macro/${{ matrix.isa }}/$(basename "${src}" .asm)-${{ matrix.isa }}.bin"
            
            # Só usa NASM para x86 e ARM (se for sintaxe compatível), RISC-V usa ferramentas específicas
            if [[ "${{ matrix.isa }}" == "riscv" ]]; then
              echo "Skipping NASM for RISC-V source: $src"
              continue
            fi
            
            nasm -f bin "$src" -o "$out" || echo "Warning: Failed to assemble $src for ${{ matrix.isa }}"
            
            if [ -f "$out" ]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$out" > "$out.sha256"
              else
                shasum -a 256 "$out" > "$out.sha256"
              fi
            fi
          done < <(find src/macro -type f -name "$pattern" -print0)

          if [ "$found" -eq 0 ]; then
            echo "No macro assembler sources found. Expected src/macro/*.asm"
            exit 1
          fi

      - name: Upload Macro Assembler Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macro-${{ matrix.os }}-${{ matrix.isa }}
          path: build/macro/${{ matrix.isa }}/*

  release:
    needs: build-macro-asm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Manifest JSON
        run: |
          echo "[" > manifest.json
          for f in $(find ./artifacts -name '*.bin'); do
            HASH=$(sha256sum "$f" | cut -d ' ' -f1)
            SIZE=$(stat -c%s "$f")
            OSISA=$(basename $(dirname "$f"))
            echo "  {\"file\":\"$(basename $f)\",\"osisa\":\"$OSISA\",\"size\":$SIZE,\"sha256\":\"$HASH\"}," >> manifest.json
          done
          sed -i '$ s/,$//' manifest.json
          echo "]" >> manifest.json

      - name: Create Tag for Release
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-run${{ github.run_number }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Macro Assembler Matrix Release ${{ steps.tag.outputs.tag }}"
          body: |
            Automated multi-OS / multi-ISA macro assembler release.
            Includes SHA256 hashes and manifest.json for integrity verification.
            Commit: ${{ github.sha }}
          files: |
            ./artifacts/**/*
            manifest.json
