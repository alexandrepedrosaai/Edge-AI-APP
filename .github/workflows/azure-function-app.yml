name: Deploy to Azure Function App

on:
  push:
    branches: [ "main" ]
    paths:
      - 'azure-functions-node/**'
      - 'server/**'
      - '.github/workflows/azure-function-app.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AZURE_FUNCTIONAPP_NAME: "edge-ai-functions"
  AZURE_RESOURCE_GROUP: "edge-ai-rg"
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "azure-functions-node"
  NODE_VERSION: "20"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://edge-ai-functions.azurewebsites.net

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/package.json"

      - name: Install dependencies
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          npm install --production

      - name: Azure Login with Client Secret
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Verify deployment
        run: |
          echo "Verifying Function App deployment..."
          az functionapp show \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "{name: name, state: state, hostNames: defaultHostName}" \
            --output table

          echo ""
          echo "Deployed Functions:"
          az functionapp function list \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[].{name: name}" \
            --output table || echo "Functions still initializing..."

      - name: Health check
        run: |
          HOSTNAME=$(az functionapp show \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "defaultHostName" -o tsv)

          echo "Testing Function App: https://$HOSTNAME/api/health"

          for i in {1..6}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$HOSTNAME/api/health" --max-time 15 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
              echo "Function App is responding!"
              break
            fi
            sleep 10
          done

      - name: Configure application settings
        run: |
          az functionapp config appsettings set \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --settings \
              VITE_APP_TITLE="Edge AI App" \
              VITE_APP_LOGO="/logo.svg" \
              NODE_ENV="production"

      - name: Create deployment summary
        if: always()
        run: |
          echo "# Azure Function App Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Function App**: ${{ env.AZURE_FUNCTIONAPP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status" >> $GITHUB_STEP_SUMMARY
          echo "Deployment completed" >> $GITHUB_STEP_SUMMARY

      - name: Azure Logout
        if: always()
        run: az logout

  rollback-on-failure:
    if: failure()
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Azure Login with Client Secret
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Trigger rollback
        run: |
          echo "Deployment failed! Check Azure Portal for deployment history."
          az functionapp show \
            --name "edge-ai-functions" \
            --resource-group "edge-ai-rg" \
            --query "{name: name, state: state}" -o table

      - name: Azure Logout
        if: always()
        run: az logout
