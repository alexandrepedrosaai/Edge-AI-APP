name: CI/CD Objective-C Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNUstep and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnustep gnustep-devel gobjc clang libgnustep-base-dev libobjc-11-dev libblocksruntime-dev gnustep-base-runtime

      - name: Build Objective-C binary
        run: |
          mkdir -p dist
          . /usr/share/GNUstep/Makefiles/GNUstep.sh
          # Use gnustep-config to get the correct include paths for both GNUstep and Objective-C runtime
          # Adding -I. to find local headers if any
          clang -fblocks \
            $(gnustep-config --objc-flags) \
            -I/usr/include/GNUstep \
            -I/usr/include/BlocksRuntime \
            -I. \
            src/EdgeAIManager.m -o dist/EdgeAIManager \
            $(gnustep-config --base-libs) \
            -lBlocksRuntime -lobjc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-objectivec
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: edge-ai-objectivec
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Automated Objective-C Release v${{ github.run_number }}"
          body: |
            Automated build and release of Edge-AI-APP Objective-C module:
            - EdgeAIManager.m compiled into binary
            - Built on Linux (Ubuntu) using GNUstep
            - Corrected include paths using gnustep-config
            - Fixed missing objc/objc.h by ensuring correct runtime headers
          files: release/**
