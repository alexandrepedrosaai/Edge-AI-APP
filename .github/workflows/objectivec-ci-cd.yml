name: CI/CD Objective-C Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNUstep and dependencies
        run: |
          sudo apt-get update
          # libobjc-12-dev provides the necessary objc/objc.h headers on Ubuntu 22.04
          sudo apt-get install -y gnustep gnustep-devel gobjc clang libgnustep-base-dev libobjc-12-dev libblocksruntime-dev gnustep-base-runtime

      - name: Build Objective-C binary
        run: |
          mkdir -p dist
          . /usr/share/GNUstep/Makefiles/GNUstep.sh
          
          # Find the exact path for objc/objc.h (usually in /usr/lib/gcc/x86_64-linux-gnu/12/include)
          OBJC_INCLUDE_PATH=$(find /usr/lib/gcc -name objc.h | grep "objc/objc.h" | head -n 1 | xargs dirname | xargs dirname)
          echo "Found Objective-C headers at: $OBJC_INCLUDE_PATH"
          
          # Build with explicit include paths for GNUstep, Blocks, and the discovered libobjc path
          clang -fblocks \
            -I"$OBJC_INCLUDE_PATH" \
            -I/usr/include/GNUstep \
            -I/usr/include/BlocksRuntime \
            $(gnustep-config --objc-flags) \
            src/EdgeAIManager.m -o dist/EdgeAIManager \
            $(gnustep-config --base-libs) \
            -lBlocksRuntime -lobjc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-objectivec
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: edge-ai-objectivec
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Automated Objective-C Release v${{ github.run_number }}"
          body: |
            Automated build and release of Edge-AI-APP Objective-C module:
            - EdgeAIManager.m compiled into binary
            - Built on Linux (Ubuntu) using GNUstep
            - Fixed missing objc/objc.h by installing libobjc-12-dev and dynamically discovering include path
            - Self-contained source for better compatibility
          files: release/**
