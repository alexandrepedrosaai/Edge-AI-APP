name: CI/CD Objective-C Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNUstep and dependencies
        run: |
          sudo apt-get update
          OBJC_DEV_PACKAGE=$(apt-cache search '^libobjc-[0-9]+-dev$' | awk '{print $1}' | sort -V | tail -n 1)
          if [ -z "$OBJC_DEV_PACKAGE" ]; then
            echo "Unable to locate an Objective-C development package on this runner"
            exit 1
          fi

          echo "Installing Objective-C runtime package: $OBJC_DEV_PACKAGE"
          sudo apt-get install -y \
            gnustep \
            gnustep-devel \
            gobjc \
            clang \
            libgnustep-base-dev \
            "$OBJC_DEV_PACKAGE" \
            libobjc4 \
            libblocksruntime-dev \
            gnustep-base-runtime

      - name: Build Objective-C binary
        run: |
          mkdir -p dist
          . /usr/share/GNUstep/Makefiles/GNUstep.sh

          # Find the exact path for objc/objc.h and the matching libobjc runtime directory.
          OBJC_INCLUDE_PATH=$(find /usr/lib/gcc -path '*/include/objc/objc.h' | sort -V | tail -n 1 | xargs dirname | xargs dirname)
          OBJC_RUNTIME_LIB=$(gcc -print-file-name=libobjc.so)
          if [ -z "$OBJC_INCLUDE_PATH" ] || [ "$OBJC_RUNTIME_LIB" = "libobjc.so" ]; then
            echo "Failed to discover Objective-C headers or runtime library"
            exit 1
          fi
          OBJC_LIB_PATH=$(dirname "$OBJC_RUNTIME_LIB")

          echo "Found Objective-C headers at: $OBJC_INCLUDE_PATH"
          echo "Found Objective-C runtime library at: $OBJC_RUNTIME_LIB"

          # Build with explicit include paths for GNUstep, Blocks, and the discovered libobjc path.
          clang -fblocks \
            -I"$OBJC_INCLUDE_PATH" \
            -I/usr/include/GNUstep \
            -I/usr/include/BlocksRuntime \
            $(gnustep-config --objc-flags) \
            src/EdgeAIManager.m -o dist/EdgeAIManager \
            -L"$OBJC_LIB_PATH" \
            $(gnustep-config --base-libs) \
            -lBlocksRuntime -lobjc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-objectivec
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: edge-ai-objectivec
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Automated Objective-C Release v${{ github.run_number }}"
          body: |
            Automated build and release of Edge-AI-APP Objective-C module:
            - EdgeAIManager.m compiled into binary
            - Built on Linux (Ubuntu) using GNUstep
            - Fixed missing objc/objc.h by installing libobjc-12-dev and dynamically discovering include path
            - Self-contained source for better compatibility
          files: release/**
