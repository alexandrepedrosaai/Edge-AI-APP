name: CI/CD Objective-C Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # Objective-C requires macOS runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Compile Objective-C file into binary
      - name: Build Objective-C binary
        run: |
          mkdir -p dist
          clang -framework Foundation -framework UIKit src/EdgeAIManager.m -o dist/EdgeAIManager

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-objectivec
          path: dist/*

  release:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: edge-ai-objectivec
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Automated Objective-C Release v${{ github.run_number }}"
          body: |
            Automated build and release of Edge-AI-APP Objective-C module:
            - EdgeAIManager.m compiled into binary
            - Includes Foundation + UIKit frameworks
          files: release/**
