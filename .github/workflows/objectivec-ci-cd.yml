name: CI/CD Objective-C Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest   # Switched from macOS to Ubuntu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNUstep and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnustep gnustep-devel gobjc clang libgnustep-base-dev libobjc-11-dev

      # Compile Objective-C file into binary using GNUstep on Linux
      - name: Build Objective-C binary
        run: |
          mkdir -p dist
          # Source GNUstep environment and compile
          . /usr/share/GNUstep/Makefiles/GNUstep.sh
          # Add current src directory and GNUstep headers to include path, and enable Blocks support
          clang -fblocks -Isrc -I/usr/include/GNUstep `gnustep-config --objc-flags` `gnustep-config --base-libs` src/EdgeAIManager.m -o dist/EdgeAIManager

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-objectivec
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: edge-ai-objectivec
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Automated Objective-C Release v${{ github.run_number }}"
          body: |
            Automated build and release of Edge-AI-APP Objective-C module:
            - EdgeAIManager.m compiled into binary
            - Built on Linux (Ubuntu) using GNUstep
            - Added -fblocks to clang to support Objective-C blocks
            - Added -I/usr/include/GNUstep to fix missing Foundation headers
            - Removed -fobjc-arc as it is unsupported on legacy GNUstep runtime
            - Added compatibility macros to src/objc.h for GNUstep
          files: release/**
