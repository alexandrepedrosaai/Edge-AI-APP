name: CI-CD Microcode Automated Releases
push:
    branches: ["main"]
    tags:
      - "v*"
jobs:
  build-microcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile Microcode
        run: |
          set -euo pipefail
          mkdir -p build/microcode
          mapfile -t SRCS < <(find src -type f -name '*.c' | grep -E '/microcode/' || true)

          if [ "${#SRCS[@]}" -eq 0 ]; then
            echo "No microcode C sources found. Expected something like src/microcode/*.c"
            echo "Fix by adding the microcode sources or updating the workflow path."
            exit 1
          fi

          gcc -O2 -o build/microcode/microcode.bin "${SRCS[@]}"

      - name: Validate ISA Simulation
        run: |
          ./tools/isa-simulator --input build/microcode/microcode.bin --validate

      - name: Upload Microcode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microcode-binary
          path: build/microcode/microcode.bin
    release:
   needs: build-microcode
  runs-on: ubuntu-latest
  permissions:
    contents: write
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # required to create/push tags reliably

    - name: Download Microcode Artifact
      uses: actions/download-artifact@v4
      with:
        name: microcode-binary
        path: .

    - name: Create Tag for Release
      run: |
        TAG="v$(date +'%Y.%m.%d')-run${{ github.run_number }}"
        echo "TAG=$TAG" >> $GITHUB_ENV
        echo "Creating tag $TAG"
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag "$TAG"
        git push origin "$TAG"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        files: microcode.bin
