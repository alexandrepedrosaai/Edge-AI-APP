name: SBOM & Security Scan

on:
  push:
    branches:
      - main

jobs:
  sbom-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # SBOMs
      - name: Generate SBOM for frontend
        run: syft docker:alexandrepedrosaai/edge-frontend:latest -o cyclonedx-json > sbom/frontend-sbom.json

      - name: Generate SBOM for backend
        run: syft docker:alexandrepedrosaai/edge-backend:latest -o cyclonedx-json > sbom/backend-sbom.json

      - name: Generate SBOM for infra
        run: syft docker:alexandrepedrosaai/edge-infra:latest -o cyclonedx-json > sbom/infra-sbom.json

      - name: Generate SBOM for python
        run: syft docker:alexandrepedrosaai/edge-python:latest -o cyclonedx-json > sbom/python-sbom.json

      - name: Generate SBOM for deploy
        run: syft docker:alexandrepedrosaai/edge-deploy:latest -o cyclonedx-json > sbom/deploy-sbom.json

      # Vulnerability Scans
      - name: Scan frontend image
        run: trivy image --format table --output reports/frontend-vuln.txt alexandrepedrosaai/edge-frontend:latest

      - name: Scan backend image
        run: trivy image --format table --output reports/backend-vuln.txt alexandrepedrosaai/edge-backend:latest

      - name: Scan infra image
        run: trivy image --format table --output reports/infra-vuln.txt alexandrepedrosaai/edge-infra:latest

      - name: Scan python image
        run: trivy image --format table --output reports/python-vuln.txt alexandrepedrosaai/edge-python:latest

      - name: Scan deploy image
        run: trivy image --format table --output reports/deploy-vuln.txt alexandrepedrosaai/edge-deploy:latest

      - name: Commit and push updated SBOMs & reports
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add sbom/*.json reports/*.txt
          git commit -m "Update SBOMs & vulnerability reports [CI]"
          git push
