name: SBOM & Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  sbom-security:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create required directories
        run: |
          mkdir -p sbom reports
          echo "Directories created"
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            apt-transport-https \
            gnupg \
            lsb-release \
            git \
            jq
      
      - name: Install Syft
        run: |
          echo "Installing Syft..."
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft --version
      
      - name: Install Trivy
        run: |
          echo "Installing Trivy..."
          sudo apt-get update
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version
      
      - name: Scan repository with Trivy
        run: |
          echo "Scanning repository with Trivy..."
          trivy fs --format json --output reports/trivy-fs-report.json . || true
          trivy fs --format table --output reports/trivy-fs-report.txt . || true
      
      - name: Generate SBOM for client
        run: |
          echo "Generating SBOM for client..."
          if [ -d "client" ]; then
            syft dir:./client -o cyclonedx-json > sbom/client-sbom.json || echo "Client SBOM generation skipped"
          fi
      
      - name: Generate SBOM for server
        run: |
          echo "Generating SBOM for server..."
          if [ -d "server" ]; then
            syft dir:./server -o cyclonedx-json > sbom/server-sbom.json || echo "Server SBOM generation skipped"
          fi
      
      - name: Generate SBOM for azure-functions
        run: |
          echo "Generating SBOM for azure-functions..."
          if [ -d "azure-functions" ]; then
            syft dir:./azure-functions -o cyclonedx-json > sbom/azure-functions-sbom.json || echo "Azure Functions SBOM generation skipped"
          fi
      
      - name: Generate SBOM for python
        run: |
          echo "Generating SBOM for python..."
          if [ -d "python" ]; then
            syft dir:./python -o cyclonedx-json > sbom/python-sbom.json || echo "Python SBOM generation skipped"
          fi
      
      - name: Scan dependencies with Trivy
        run: |
          echo "Scanning dependencies..."
          if [ -f "package.json" ]; then
            trivy fs --severity HIGH,CRITICAL --format json --output reports/npm-vulnerabilities.json . || true
          fi
          if [ -f "requirements.txt" ]; then
            trivy fs --severity HIGH,CRITICAL --format json --output reports/python-vulnerabilities.json . || true
          fi
      
      - name: Generate security report
        run: |
          cat > reports/security-summary.md << 'EOF'
          # Security Scan Report
          
          Generated: $(date)
          
          ## Scan Results
          
          ### Trivy Filesystem Scan
          $(trivy fs --format table . 2>/dev/null || echo "No critical issues found")
          
          ### Dependencies
          - Node.js: $([ -f package.json ] && echo "✓" || echo "✗")
          - Python: $([ -f requirements.txt ] && echo "✓" || echo "✗")
          - Docker: $([ -f Dockerfile ] && echo "✓" || echo "✗")
          
          ### SBOM Files Generated
          $(ls -1 sbom/ 2>/dev/null | sed 's/^/- /' || echo "No SBOM files generated")
          
          EOF
          cat reports/security-summary.md
      
      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: reports/
          retention-days: 30
      
      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: sbom/
          retention-days: 30
      
      - name: Create commit with results
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes
          if [ -n "$(git status --porcelain)" ]; then
            git add sbom/ reports/ || true
            git commit -m "chore: Update SBOM and security scan reports [skip ci]" || true
            git push || true
          else
            echo "No changes to commit"
          fi
      
      - name: Summary
        if: always()
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy FS Scan: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM Generation: ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Reports: $(ls -1 reports/ 2>/dev/null | wc -l) files" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM: $(ls -1 sbom/ 2>/dev/null | wc -l) files" >> $GITHUB_STEP_SUMMARY
