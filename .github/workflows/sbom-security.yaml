name: Generate SBOMs

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create required directories
        run: |
          mkdir -p sbom reports
          echo "Directories created"
      
      - name: Install system dependencies
        run: |
          echo "Installing system dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl wget git jq python3 python3-pip || true
      
      - name: Install Syft
        run: |
          echo "Installing Syft..."
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin 2>/dev/null || true
          syft --version 2>/dev/null || echo "Syft not available, continuing..."
      
      - name: Generate SBOM for root
        run: |
          echo "Generating SBOM for root directory..."
          if command -v syft &> /dev/null; then
            syft dir:. -o cyclonedx-json > sbom/root-sbom.json 2>/dev/null || echo "Failed to generate root SBOM"
          else
            echo "Syft not available, skipping root SBOM"
          fi
      
      - name: Generate SBOM for client
        run: |
          if [ -d "client" ]; then
            echo "Generating SBOM for client..."
            if command -v syft &> /dev/null; then
              syft dir:./client -o cyclonedx-json > sbom/client-sbom.json 2>/dev/null || echo "Failed to generate client SBOM"
            fi
          fi
      
      - name: Generate SBOM for frontend
        run: |
          if [ -d "frontend" ]; then
            echo "Generating SBOM for frontend..."
            if command -v syft &> /dev/null; then
              syft dir:./frontend -o cyclonedx-json > sbom/frontend-sbom.json 2>/dev/null || echo "Failed to generate frontend SBOM"
            fi
          fi
      
      - name: Generate SBOM for backend
        run: |
          if [ -d "backend" ]; then
            echo "Generating SBOM for backend..."
            if command -v syft &> /dev/null; then
              syft dir:./backend -o cyclonedx-json > sbom/backend-sbom.json 2>/dev/null || echo "Failed to generate backend SBOM"
            fi
          fi
      
      - name: Generate SBOM for server
        run: |
          if [ -d "server" ]; then
            echo "Generating SBOM for server..."
            if command -v syft &> /dev/null; then
              syft dir:./server -o cyclonedx-json > sbom/server-sbom.json 2>/dev/null || echo "Failed to generate server SBOM"
            fi
          fi
      
      - name: Generate SBOM for azure-functions
        run: |
          if [ -d "azure-functions" ]; then
            echo "Generating SBOM for azure-functions..."
            if command -v syft &> /dev/null; then
              syft dir:./azure-functions -o cyclonedx-json > sbom/azure-functions-sbom.json 2>/dev/null || echo "Failed to generate azure-functions SBOM"
            fi
          fi
      
      - name: Generate SBOM for python
        run: |
          if [ -d "python" ]; then
            echo "Generating SBOM for python..."
            if command -v syft &> /dev/null; then
              syft dir:./python -o cyclonedx-json > sbom/python-sbom.json 2>/dev/null || echo "Failed to generate python SBOM"
            fi
          fi
      
      - name: Generate SBOM for infra
        run: |
          if [ -d "infra" ]; then
            echo "Generating SBOM for infra..."
            if command -v syft &> /dev/null; then
              syft dir:./infra -o cyclonedx-json > sbom/infra-sbom.json 2>/dev/null || echo "Failed to generate infra SBOM"
            fi
          fi
      
      - name: Create security summary
        run: |
          echo "# Security Summary" > reports/security-summary.md
          echo "" >> reports/security-summary.md
          echo "## SBOM Files Generated" >> reports/security-summary.md
          ls -lh sbom/*.json 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}' >> reports/security-summary.md || echo "- No SBOM files generated" >> reports/security-summary.md
          echo "" >> reports/security-summary.md
          echo "Generated at: $(date)" >> reports/security-summary.md
      
      - name: Commit SBOM files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add sbom/ reports/ 2>/dev/null || true
          git commit -m "chore: Update SBOM and security scan reports [skip ci]" 2>/dev/null || echo "No changes to commit"
          git push 2>/dev/null || echo "Nothing to push"
      
      - name: Create job summary
        run: |
          echo "## SBOM Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          if [ -d "sbom" ]; then
            ls -1 sbom/*.json 2>/dev/null | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || echo "- No SBOM files" >> $GITHUB_STEP_SUMMARY
          fi
