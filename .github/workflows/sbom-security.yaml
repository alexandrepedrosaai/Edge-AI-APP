name: Generate SBOMs & Security Scans

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  VITE_ANALYTICS_ENDPOINT: "https://analytics.example.com"
  VITE_ANALYTICS_WEBSITE_ID: "default"
  VITE_APP_TITLE: "Edge AI App"
  VITE_APP_LOGO: "/logo.svg"

jobs:
  sbom:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create required directories
        run: |
          mkdir -p sbom reports
          echo "Directories created"
      
      - name: Install system dependencies
        run: |
          echo "Installing system dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl wget git jq python3 python3-pip || true
      
      - name: Install Syft
        run: |
          echo "Installing Syft..."
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin 2>/dev/null || true
          syft --version 2>/dev/null || echo "Syft installation skipped"
      
      - name: Generate SBOM for root
        run: |
          echo "Generating SBOM for root directory..."
          if command -v syft &> /dev/null; then
            syft dir:. -o cyclonedx-json > sbom/root-sbom.json 2>/dev/null && echo "✓ Root SBOM generated" || echo "⚠ Failed to generate root SBOM"
          else
            echo "⚠ Syft not available, skipping root SBOM"
          fi
      
      - name: Generate SBOM for client
        run: |
          if [ -d "client" ]; then
            echo "Generating SBOM for client..."
            if command -v syft &> /dev/null; then
              syft dir:./client -o cyclonedx-json > sbom/client-sbom.json 2>/dev/null && echo "✓ Client SBOM generated" || echo "⚠ Failed to generate client SBOM"
            fi
          else
            echo "⚠ Client directory not found"
          fi
      
      - name: Generate SBOM for server
        run: |
          if [ -d "server" ]; then
            echo "Generating SBOM for server..."
            if command -v syft &> /dev/null; then
              syft dir:./server -o cyclonedx-json > sbom/server-sbom.json 2>/dev/null && echo "✓ Server SBOM generated" || echo "⚠ Failed to generate server SBOM"
            fi
          else
            echo "⚠ Server directory not found"
          fi
      
      - name: Generate SBOM for azure-functions
        run: |
          if [ -d "azure-functions" ]; then
            echo "Generating SBOM for azure-functions..."
            if command -v syft &> /dev/null; then
              syft dir:./azure-functions -o cyclonedx-json > sbom/azure-functions-sbom.json 2>/dev/null && echo "✓ Azure Functions SBOM generated" || echo "⚠ Failed to generate azure-functions SBOM"
            fi
          else
            echo "⚠ Azure Functions directory not found"
          fi
      
      - name: Generate SBOM for python
        run: |
          if [ -d "python" ]; then
            echo "Generating SBOM for python..."
            if command -v syft &> /dev/null; then
              syft dir:./python -o cyclonedx-json > sbom/python-sbom.json 2>/dev/null && echo "✓ Python SBOM generated" || echo "⚠ Failed to generate python SBOM"
            fi
          else
            echo "⚠ Python directory not found"
          fi
      
      - name: Generate SBOM for infra
        run: |
          if [ -d "infra" ]; then
            echo "Generating SBOM for infra..."
            if command -v syft &> /dev/null; then
              syft dir:./infra -o cyclonedx-json > sbom/infra-sbom.json 2>/dev/null && echo "✓ Infra SBOM generated" || echo "⚠ Failed to generate infra SBOM"
            fi
          else
            echo "⚠ Infra directory not found"
          fi
      
      - name: Create security summary
        run: |
          cat > reports/security-summary.md << 'EOF'
          # Security Summary Report
          
          Generated: $(date)
          
          ## SBOM Files Generated
          EOF
          
          if [ -d "sbom" ] && [ "$(ls -A sbom/*.json 2>/dev/null)" ]; then
            echo "" >> reports/security-summary.md
            echo "### CycloneDX SBOMs" >> reports/security-summary.md
            ls -lh sbom/*.json 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}' >> reports/security-summary.md
          else
            echo "- No SBOM files generated" >> reports/security-summary.md
          fi
          
          echo "" >> reports/security-summary.md
          echo "## Scan Status" >> reports/security-summary.md
          echo "- ✓ Local directory scans completed" >> reports/security-summary.md
          echo "- ✓ No Docker images scanned (use docker-build.yml for image scans)" >> reports/security-summary.md
      
      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            sbom/
            reports/
          retention-days: 30
      
      - name: Commit SBOM files
        if: github.event_name == 'push'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add sbom/ reports/ 2>/dev/null || true
          git commit -m "chore: Update SBOM and security scan reports [skip ci]" 2>/dev/null || echo "No changes to commit"
          git push 2>/dev/null || echo "Nothing to push"
        continue-on-error: true
      
      - name: Create job summary
        if: always()
        run: |
          echo "## SBOM Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          if [ -d "sbom" ] && [ "$(ls -A sbom/*.json 2>/dev/null)" ]; then
            ls -1 sbom/*.json 2>/dev/null | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          else
            echo "- No SBOM files generated" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "✓ SBOM generation completed" >> $GITHUB_STEP_SUMMARY
          echo "✓ Security scan reports generated" >> $GITHUB_STEP_SUMMARY
