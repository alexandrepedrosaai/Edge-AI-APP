name: Dynamic WebAssembly Build & Face-Mapped Deploy

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/index.html'
      - 'WEBASSEMBLY/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WABT (WebAssembly Binary Toolkit)
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt

      - name: Granular WASM Build
        id: build
        run: |
          mkdir -p docs
          cd WEBASSEMBLY
          
          # Compilar cada função explicitamente para garantir que as dependências do index.html sejam atendidas
          functions=("Functions" "Linear" "Matrixderivate" "Hyperbolic" "Factor" "Unified")
          
          for func in "${functions[@]}"; do
            if [ -f "${func}.wat" ]; then
              echo "🚀 Compiling Granular Module: ${func}.wat"
              wat2wasm "${func}.wat" -o "../docs/${func}.wasm"
            else
              echo "⚠️ Warning: ${func}.wat not found, skipping..."
            fi
          done
          
          # Compilar quaisquer outros arquivos .wat remanescentes
          for file in *.wat; do
            base=$(basename "$file" .wat)
            if [[ ! " ${functions[@]} " =~ " ${base} " ]]; then
              echo "📦 Compiling Additional Module: $file"
              wat2wasm "$file" -o "../docs/${base}.wasm"
            fi
          done
          
          echo "✅ Build Complete. Artifacts in docs/:"
          ls -lh ../docs/*.wasm

      - name: Validate index.html Linkage
        run: |
          echo "🔍 Checking index.html for WASM references..."
          grep -E "loadWasm\(\".+\.wasm\"\)" docs/index.html || echo "No WASM references found in index.html"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Sync Binaries to Branch
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/*.wasm
          if ! git diff --cached --quiet; then
            git commit -m "chore: dynamic granular build of WASM modules [skip ci]"
            git push
          else
            echo "No changes in binaries to sync."
          fi
