name: CI-CD Multi-OS Multi-ISA Binary Releases

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-binary-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        isa: [x86, arm, riscv]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
        shell: powershell

      - name: Make tools and simulators executable
        if: runner.os != 'Windows'
        run: chmod +x ./tools/bin-encoder ./simulators/${{ matrix.isa }}
        shell: bash

      - name: Compile source
        run: |
          make build-${{ matrix.isa }}
          echo "Compilando código em ${{ matrix.os }} para ISA ${{ matrix.isa }}..."
        shell: bash

      - name: Generate Binary Machine Code
        run: |
          mkdir -p ./artifacts/${{ matrix.os }}/${{ matrix.isa }}
          ./tools/bin-encoder ./build/${{ matrix.isa }}/bin > ./artifacts/${{ matrix.os }}/${{ matrix.isa }}/machine_code.bin
          echo "Binary Machine Code gerado em ./artifacts/${{ matrix.os }}/${{ matrix.isa }}/machine_code.bin"
        shell: bash

      - name: Run ISA simulation tests
        run: |
          ./simulators/${{ matrix.isa }} --load ./artifacts/${{ matrix.os }}/${{ matrix.isa }}/machine_code.bin
        shell: bash

      - name: Package artifacts
        run: |
          tar -czf release-${{ matrix.os }}-${{ matrix.isa }}-${{ github.sha }}.tar.gz ./artifacts/${{ matrix.os }}/${{ matrix.isa }}
          echo "Pacote de release criado para ${{ matrix.os }} / ${{ matrix.isa }}."
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-release-${{ matrix.os }}-${{ matrix.isa }}
          path: release-${{ matrix.os }}-${{ matrix.isa }}-${{ github.sha }}.tar.gz

  release:
    needs: build-binary-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./releases

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Multi-OS Multi-ISA Release v1.0.${{ github.run_number }}"
          body: "Automated release for OS + ISA binaries."
          files: ./releases/**

  deploy:
    needs: release
    runs-on: ubuntu-latest
    env:
      AZURE_DEVOPS_ORG_URL: "https://dev.azure.com/yourorg"
      AZURE_DEVOPS_FEED: "EdgeAIApp"
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./releases

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Add Azure DevOps extension
        run: az extension add --name azure-devops

      - name: Deploy to Azure Artifacts
        env:
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
        run: |
          for os in ubuntu-latest windows-latest macos-latest; do
            for isa in x86 arm riscv; do
              artifact_path="./releases/binary-release-${os}-${isa}/release-${os}-${isa}-${{ github.sha }}.tar.gz"
              az artifacts universal publish \
                --organization "${AZURE_DEVOPS_ORG_URL}" \
                --feed "${AZURE_DEVOPS_FEED}" \
                --name "binary-release-${os}-${isa}" \
                --version "1.0.${{ github.run_number }}" \
                --path "${artifact_path}"
            done
          done
