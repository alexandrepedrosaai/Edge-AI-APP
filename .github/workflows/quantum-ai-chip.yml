name: Quantum AI Chip Microwave MCU Neural Matricial Learning Procedural Transduction, Firmware-ota-pipeline

on:
  push:
    branches: ["main"]
    tags: ["v*", "release-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quantum-ai-chip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: "8.0.x"
  EMBEDDING_DIM: "12"

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      docker_tag: ${{ steps.version.outputs.docker_tag }}
      repo_lower: ${{ steps.version.outputs.repo_lower }}
      safe_version: ${{ steps.version.outputs.safe_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      sha_short: ${{ steps.version.outputs.sha_short }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Resolve semantic version and tags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME}"
          SHA_SHORT="${GITHUB_SHA::7}"
          IS_RELEASE="false"
          RELEASE_TAG=""

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SEMVER="${REF_NAME#v}"
            RELEASE_TAG="${REF_NAME}"
            IS_RELEASE="true"
          elif [[ "${GITHUB_REF}" == refs/tags/release-* ]]; then
            SEMVER="0.2.0-release.${GITHUB_RUN_NUMBER}+sha.${SHA_SHORT}"
            RELEASE_TAG="${REF_NAME}"
            IS_RELEASE="true"
          else
            SEMVER="0.2.0-ci.${GITHUB_RUN_NUMBER}+sha.${SHA_SHORT}"
          fi

          SAFE_VERSION="${SEMVER//+/-}"
          # Docker tags and repository names must be lowercase
          DOCKER_TAG=$(echo "${SAFE_VERSION}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          

          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "repo_lower=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"
          echo "safe_version=${SAFE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"

  quality-and-artifacts:
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.qsproj', '**/*.fsproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            3.1.x
            6.0.x
            ${{ env.DOTNET_VERSION }}
          cache: false

      - name: Build Quantum Project
        run: dotnet build src/wave-space-dl.qsproj --configuration Release
      
      - name: Pack NuGet Package
        run: dotnet pack src/wave-space-dl.qsproj --configuration Release -o dist/nuget -p:PackageVersion=${{ needs.prepare-version.outputs.semver }}

      - name: Publish NuGet Package to GitHub
        if: github.event_name != 'pull_request'
        run: |
          dotnet nuget push dist/nuget/*.nupkg --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ github.token }} --skip-duplicate

      - name: Run Neural Quantum DL Operations
        run: dotnet run --project src/wave-space-dl.qsproj
      - name: Run Comprehensive Tests
        run: |
          if [ -f tests/wave-space-dl.Tests.qsproj ]; then
            dotnet test tests/wave-space-dl.Tests.qsproj --configuration Release --logger "console;verbosity=detailed"
          else
            echo "Tests project not found, skipping."
          fi
      - name: Verify Root Files Integration
        run: |
          echo "Checking integration of core Q# files..."
          ls -l ProceduralDLEncoder.qs Program.qs _version.qs cli.qs dataclass.qs procedural_dl.qs src/wave-space-dl.qs src/LLMNeuralDLQuantum.qs
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-ai-chip-quality-${{ needs.prepare-version.outputs.safe_version }}
          path: dist/*

  build-all-binaries:
    needs: [prepare-version, quality-and-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and Run Binary Generator
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: quantum-ai-chip-build:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Create Dist Directory
        run: mkdir -p dist

      - name: Cache Step 1 - x86 Binaries
        uses: actions/cache@v4
        with:
          path: dist/x86
          key: ${{ runner.os }}-extract-x86-${{ github.sha }}
      - name: Extract Step 1 - x86 Binaries
        run: docker run --rm -v $PWD/dist:/out quantum-ai-chip-build:latest sh -c "mkdir -p /out/x86 && cp -r /app/build/x86/* /out/x86/ || true"

      - name: Cache Step 2 - ARM Binaries
        uses: actions/cache@v4
        with:
          path: dist/arm
          key: ${{ runner.os }}-extract-arm-${{ github.sha }}
      - name: Extract Step 2 - ARM Binaries
        run: docker run --rm -v $PWD/dist:/out quantum-ai-chip-build:latest sh -c "mkdir -p /out/arm && cp -r /app/build/arm/* /out/arm/ || true"

      - name: Cache Step 3 - RISC-V Binaries
        uses: actions/cache@v4
        with:
          path: dist/riscv
          key: ${{ runner.os }}-extract-riscv-${{ github.sha }}
      - name: Extract Step 3 - RISC-V Binaries
        run: docker run --rm -v $PWD/dist:/out quantum-ai-chip-build:latest sh -c "mkdir -p /out/riscv && cp -r /app/build/riscv/* /out/riscv/ || true"

      - name: Cache Step 4 - Q# Source Artifacts
        uses: actions/cache@v4
        with:
          path: dist/qsharp
          key: ${{ runner.os }}-extract-qsharp-${{ github.sha }}
      - name: Extract Step 4 - Q# Source Artifacts
        run: docker run --rm -v $PWD/dist:/out quantum-ai-chip-build:latest sh -c "mkdir -p /out/qsharp && cp /app/src/*.qs /out/qsharp/ || true"

      - name: Cache Step 5 - .NET Libraries
        uses: actions/cache@v4
        with:
          path: dist/dotnet
          key: ${{ runner.os }}-extract-dotnet-${{ github.sha }}
      - name: Extract Step 5 - .NET Libraries
        run: docker run --rm -v $PWD/dist:/out quantum-ai-chip-build:latest sh -c "mkdir -p /out/dotnet && find /app/src -name '*.dll' -exec cp {} /out/dotnet/ \; || true"

      - name: Cache Step 6 - Config Files
        uses: actions/cache@v4
        with:
          path: dist/config
          key: ${{ runner.os }}-extract-config-${{ github.sha }}
      - name: Extract Step 6 - Config Files
        run: docker run --rm -v $PWD/dist:/out quantum-ai-chip-build:latest sh -c "mkdir -p /out/config && cp /app/*.json /out/config/ || true"

      - name: Cache Step 7 - Firmware Scripts
        uses: actions/cache@v4
        with:
          path: dist/firmware
          key: ${{ runner.os }}-extract-firmware-${{ github.sha }}
      - name: Extract Step 7 - Firmware Scripts
        run: docker run --rm -v $PWD/dist:/out quantum-ai-chip-build:latest sh -c "mkdir -p /out/firmware && cp -r /app/src/firmware/* /out/firmware/ || true"

      - name: Cache Step 8 - Manifests
        uses: actions/cache@v4
        with:
          path: dist/manifests
          key: ${{ runner.os }}-extract-manifests-${{ github.sha }}
      - name: Extract Step 8 - Manifests
        run: docker run --rm -v $PWD/dist:/out quantum-ai-chip-build:latest sh -c "mkdir -p /out/manifests && cp /app/*.asm /out/manifests/ || true"

      - name: Cache Step 9 - Build Logs
        uses: actions/cache@v4
        with:
          path: dist/logs
          key: ${{ runner.os }}-extract-logs-${{ github.sha }}
      - name: Extract Step 9 - Build Logs
        run: docker run --rm -v $PWD/dist:/out quantum-ai-chip-build:latest sh -c "mkdir -p /out/logs && cp -r /app/build/logs/* /out/logs/ || true"

      - name: Cache Step 10 - Final Distribution
        uses: actions/cache@v4
        with:
          path: dist/final
          key: ${{ runner.os }}-extract-final-${{ github.sha }}
      - name: Extract Step 10 - Final Distribution
        run: docker run --rm -v $PWD/dist:/out quantum-ai-chip-build:latest sh -c "mkdir -p /out/final && cp -r /app/dist/* /out/final/ || true"
          
      - name: Move Docker Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Generate SHA256 Checksums
        run: |
          for file_path in dist/*; do
            if [[ -f "$file_path" && ! "$file_path" =~ \.sha256$ ]]; then
              sha256sum "$file_path" > "$file_path.sha256"
            fi
          done
      
      - name: Publish Binaries to Repository (via Release if push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ needs.prepare-version.outputs.safe_version }}
          name: CI Build ${{ needs.prepare-version.outputs.safe_version }}
          files: dist/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: quantum-ai-chip-binaries-${{ needs.prepare-version.outputs.safe_version }}
          path: dist/*

  docker-package:
    needs: [prepare-version, quality-and-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-package-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-package-

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ needs.prepare-version.outputs.repo_lower }}:${{ needs.prepare-version.outputs.docker_tag }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          
      - name: Move Docker Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - uses: actions/upload-artifact@v4
        with:
          name: quantum-ai-chip-docker-${{ needs.prepare-version.outputs.safe_version }}
          path: dist/*

  ota-package:
    needs: [prepare-version, quality-and-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-ota-${{ hashFiles('**/*.qsproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-ota-

      - name: Setup .NET Runtimes for Q#
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            3.1.x
            6.0.x
          cache: false

      - run: |
          mkdir -p dist/azure-sphere
          # Force AnyCPU/arm for Q# project to avoid NETSDK1032 PlatformTarget x64 conflict
          dotnet publish src/wave-space-dl.qsproj -c Release -r linux-arm -p:PlatformTarget=AnyCpu --self-contained true -o dist/azure-sphere
          cp azure-sphere.json dist/azure-sphere/
      - run: |
          tar -czf dist/azure-sphere-ota.tar.gz -C dist/azure-sphere .
          sha256sum dist/azure-sphere-ota.tar.gz > dist/azure-sphere-ota.tar.gz.sha256

      - name: Publish OTA Bundle to Repository (via Release if push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ needs.prepare-version.outputs.safe_version }}
          files: dist/azure-sphere-ota*
          append_body: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: quantum-ai-chip-ota
          path: dist/azure-sphere-ota*

  github-release:
    if: needs.prepare-version.outputs.is_release == 'true'
    needs: [prepare-version, build-all-binaries, docker-package, ota-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cat > RELEASE_NOTES.md <<EOF
          # Quantum AI Chip Microwave MCU Neural Matricial Learning Procedural Transduction, Firmware-ota-pipeline ${GITHUB_REF_NAME}

          🚀 Automatic release generated by CI/CD pipeline.

          ## Included in this release
          - Multi-platform binaries: Linux, Windows, macOS
          - **Azure Sphere ARM binaries**
          - **Microchip ARMv7 binaries**
          - OTA bundle for Azure Sphere
          - Wave-space JSON com IA procedural DL embarcada
          - Manifests e SHA-256 checksums
          - Multi-arch Docker image publicada em ghcr.io/${{ needs.prepare-version.outputs.repo_lower }}:${{ needs.prepare-version.outputs.docker_tag }}

          ## MCU Qualities (Microchip DSNO-20WEPE301)
          - Obsolescence Management
          - Supply Chain Updates
          - Standard Compliance (JEDEC J-STD-046/048)
          - Reliability
          - Long-Term Support

          ## Security
          - Apenas GITHUB_TOKEN interno usado para autenticação
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.release_tag }}
          name: Quantum AI Chip Microwave MCU Neural Matricial Learning Procedural Transduction, Firmware-ota-pipeline ${{ needs.prepare-version.outputs.release_tag }}
          body_path: RELEASE_NOTES.md
          files: artifacts/**
          
