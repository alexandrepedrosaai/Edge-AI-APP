name: Jupyter Notebook CI/CD

on:
  push:
    branches: [ "main" ]
  release:
    types: [created]

jobs:
  build-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nbconvert pyinstaller

      - name: Execute notebook
        run: jupyter nbconvert --to notebook --execute notebooks/*.ipynb --output executed.ipynb

      - name: Convert notebook to script
        run: jupyter nbconvert --to script notebooks/*.ipynb

      - name: Build binary
        run: pyinstaller --onefile notebooks/*.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jupyter-binary
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: build-notebook
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
