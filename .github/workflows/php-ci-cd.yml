name: CI/CD PHP Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: Edge-AI-APP
      REGISTRY: dockerhub.io/edge-ai
      VERSION: 1.0.${{ github.run_number }}

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up PHP
      run: sudo apt-get update && sudo apt-get install -y php php-zip

    - name: Run PHP CI/CD Script
      run: php ci_cd.php

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-${{ env.VERSION }}
        path: artifacts/${{ env.APP_NAME }}-${{ env.VERSION }}.zip

    - name: Create Automated Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION }}
        files: artifacts/${{ env.APP_NAME }}-${{ env.VERSION }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
