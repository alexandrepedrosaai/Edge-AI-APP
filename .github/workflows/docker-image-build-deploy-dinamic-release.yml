name: Docker Image CI|CD Build Deploy and Release 3D

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Dynamic 3D Image
      run: |
        # Convert repository name to lowercase
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        
        # Create a dynamic tag with timestamp and 3D identifier
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        DYNAMIC_TAG="3d-dynamic-${TIMESTAMP}"
        
        # Define the 3D WebAssembly transformation description
        DESCRIPTION="Transform WebAssembly functions into 3D dynamic environments for Edge-AI-APP"
        
        echo "Building and pushing image: ghcr.io/${REPO_LOWER}/edge-ai-3d:${DYNAMIC_TAG}"
        
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t ghcr.io/${REPO_LOWER}/edge-ai-3d:${DYNAMIC_TAG} \
          -t ghcr.io/${REPO_LOWER}/edge-ai-3d:latest \
          --label "org.opencontainers.image.description=${DESCRIPTION}" \
          --label "com.edge-ai-app.feature=3d-wasm-transformation" \
          --file Dockerfile \
          --push \
          .

