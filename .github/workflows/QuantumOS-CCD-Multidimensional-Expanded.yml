name: QuantumOS CI/CD Multidimensional Expanded

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. Firmware Expansion
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Compile Firmware Parts
        run: |
          mkdir -p build/firmware
          # Procura arquivos .c recursivamente para evitar erro de diretório
          find . -name "*.c" -path "*/firmware/*" -exec gcc -c {} -o build/firmware/$(basename {} .c).o \;

  # 2. Opcode & Microcode
  opcode_microcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate Opcodes and Slack Microcode
        run: |
          echo "Validating Opcode Definitions..."
          find . -name "*.inc" -path "*/opcode/*" -exec cat {} +
          echo "Validating Slack Microcode ISA..."
          find . -name "*.smc" -path "*/slack_microcode/*" -exec cat {} +

  # 3. Hardware Description (VHDL/Verilog)
  hdl_validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check VHDL and Verilog Syntax
        run: |
          echo "Checking VHDL files..."
          find . -name "*.vhd" -path "*/vhdl/*"
          echo "Checking Verilog files..."
          find . -name "*.v" -path "*/verilog/*"

  # 4. RISC-V & Pure ASM
  low_level_asm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Assemble RISC-V and x86_64 ASM
        run: |
          echo "Assembling RISC-V..."
          find . -name "*.s" -path "*/riscv/*"
          echo "Assembling x86_64..."
          find . -name "*.asm" -path "*/asm/*"

  # 5. High Level (C++, Ada)
  high_level_compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Compile C++ and Ada
        run: |
          mkdir -p build/high_level
          echo "Compiling C++..."
          find . -name "*.cpp" -path "*/cpp/*" -exec g++ {} -o build/high_level/$(basename {} .cpp) \;
          echo "Compiling Ada..."
          find . -name "*.adb" -path "*/ada/*"

  # 6. Docker Image Build and Push (Corrigido)
  docker_build_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: |
          # Localiza o Dockerfile em qualquer subdiretório
          DOCKERFILE_PATH=$(find . -name Dockerfile | head -n 1)
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "ERRO: Dockerfile não encontrado no repositório!"
            exit 1
          fi
          echo "Dockerfile encontrado em: $DOCKERFILE_PATH"
          docker build -t quantum-os-image:latest -f "$DOCKERFILE_PATH" .
      - name: Status
        run: echo "Docker image built successfully."

  # 7. Release Automatizado
  release:
    runs-on: ubuntu-latest
    needs: [firmware, opcode_microcode, hdl_validation, low_level_asm, high_level_compilation, docker_build_push]
    steps:
      - uses: actions/checkout@v3
      - name: Create Quantum Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ github.sha }}
          files: |
            **/firmware/*
            **/opcode/*
            **/slack_microcode/*
            **/vhdl/*
            **/verilog/*
            **/riscv/*
            **/asm/*
            **/cpp/*
            **/ada/*
            **/Dockerfile
