name: WebGPU Neural Q-learning Procedural Inference ML DL

on:
  push:
    branches:
      - main

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      asm_matrix: ${{ steps.generate.outputs.asm_matrix }}
    steps:
      - uses: actions/checkout@v3
      - id: generate
        name: Generate per-file matrix
        run: |
          asm_matrix=$(find WebGPU -maxdepth 1 -type f -name '*.asm' | sort | jq -R -s -c 'split("\n")[:-1] | map({asm_file: ., artifact: (split("/")[-1] | sub("\\.asm$";"") | ascii_downcase | gsub("[^a-z0-9]+";"-") | gsub("(^-|-$)";""))}) | {include:.}')
          echo "asm_matrix=$asm_matrix" >> "$GITHUB_OUTPUT"

  # Build de cada ASM em job isolado (sem build-all)
  build-per-file:
    runs-on: ubuntu-latest
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.asm_matrix) }}
    steps:
      - uses: actions/checkout@v3
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Build ASM object (per file)
        run: |
          set -euo pipefail
          mkdir -p release

          asm_file="${{ matrix.asm_file }}"
          artifact="${{ matrix.artifact }}"
          object_path="release/${artifact}.o"
          log_path="release/${artifact}.log"

          if nasm -f elf64 "$asm_file" -o "$object_path" 2>"$log_path"; then
            status="built"
            rm -f "$log_path"
          else
            status="not-buildable"
          fi

          jq -n \
            --arg source "$asm_file" \
            --arg artifact "$artifact" \
            --arg status "$status" \
            --arg object_path "$object_path" \
            --arg log_path "$log_path" \
            '{source: $source, artifact: $artifact, status: $status, object_path: $object_path, log_path: $log_path}' \
            > "release/${artifact}.json"
      - name: Upload per-file build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asm-${{ matrix.artifact }}
          path: release/*

  # Testes de integração por arquivo
  test-wasm:
    runs-on: ubuntu-latest
    needs: [prepare-matrix, build-per-file]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.asm_matrix) }}
    steps:
      - name: Download per-file build artifacts
        uses: actions/download-artifact@v4
        with:
          name: asm-${{ matrix.artifact }}
          path: release
      - name: Validate build output
        run: |
          set -euo pipefail
          meta="release/${{ matrix.artifact }}.json"
          test -f "$meta"
          status=$(jq -r '.status' "$meta")

          if [ "$status" = "built" ]; then
            object_path=$(jq -r '.object_path' "$meta")
            test -s "$object_path"
            file "$object_path"
          else
            log_path=$(jq -r '.log_path' "$meta")
            test -s "$log_path"
            echo "Skipping execution for ${{ matrix.asm_file }} (not NASM buildable)."
          fi

  # Testes unitários por arquivo
  unit-tests:
    runs-on: ubuntu-latest
    needs: [prepare-matrix, test-wasm]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.asm_matrix) }}
    steps:
      - name: Download per-file tested artifacts
        uses: actions/download-artifact@v4
        with:
          name: asm-${{ matrix.artifact }}
          path: release
      - name: Validate metadata/output consistency
        run: |
          set -euo pipefail
          meta="release/${{ matrix.artifact }}.json"
          test -f "$meta"
          jq -e '.source | endswith(".asm")' "$meta" > /dev/null
          status=$(jq -r '.status' "$meta")
          if [ "$status" = "built" ]; then
            object_path=$(jq -r '.object_path' "$meta")
            test -s "$object_path"
          else
            log_path=$(jq -r '.log_path' "$meta")
            test -s "$log_path"
          fi

  # Q-learning procedural por arquivo
  q-learning-test:
    runs-on: ubuntu-latest
    needs: [prepare-matrix, unit-tests]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.asm_matrix) }}
    steps:
      - name: Download per-file artifacts
        uses: actions/download-artifact@v4
        with:
          name: asm-${{ matrix.artifact }}
          path: release
      - name: Simulate Q-learning reward loop
        run: |
          set -euo pipefail
          meta="release/${{ matrix.artifact }}.json"
          test -f "$meta"
          status=$(jq -r '.status' "$meta")

          reward=0
          for i in {1..5}; do
            if [ "$status" = "built" ]; then
              reward=$((reward+1))
            fi
          done
          echo "Final reward for ${{ matrix.asm_file }}: $reward"

  # Upload artefatos
  upload-artifacts:
    runs-on: ubuntu-latest
    needs: q-learning-test
    steps:
      - uses: actions/checkout@v3
      - name: Download per-file artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: asm-*
          merge-multiple: true
          path: release
      - uses: actions/upload-artifact@v4
        with:
          name: asm-binaries-tested
          path: release/*

  # Release automático
  release:
    runs-on: ubuntu-latest
    needs: upload-artifacts
    steps:
      - uses: actions/checkout@v3
      - name: Download tested WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: asm-binaries-tested
          path: release
      - name: Create Release
        if: ${{ hashFiles('release/*.o') != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          files: release/*.o

  # Deploy para Edge-AI-APP
  deploy:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v3
        with:
          repository: alexandrepedrosaai/Edge-AI-APP
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download tested WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: asm-binaries-tested
          path: release
      - name: Copy WASM binaries to WEBASSEMBLY and docs
        run: |
          mkdir -p WEBASSEMBLY docs
          cp release/*.o WEBASSEMBLY/ || true
          cp release/*.o docs/ || true
      - name: Update index.html with WASM file list
        run: |
          echo "<html><body><h1>Generated WASM Files</h1><ul>" > docs/index.html
          for f in release/*.o; do
            [ -e "$f" ] || continue
            fname=$(basename "$f")
            echo "<li>$fname</li>" >> docs/index.html
          done
          echo "</ul></body></html>" >> docs/index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add WEBASSEMBLY docs
          git commit -m "Deploy WASM binaries and update docs"
          git push
