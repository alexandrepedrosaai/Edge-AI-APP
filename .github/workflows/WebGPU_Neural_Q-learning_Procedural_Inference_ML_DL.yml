name: WebGPU Neural Q-learning Procedural Inference ML DL

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CLUSTERS_GPU_IMAGE: ghcr.io/alexandrepedrosaai/edge-ai-app/clusters-arrays-gpu:11
  WEBGPU_IMAGE: ghcr.io/alexandrepedrosaai/edge-ai-app/webgpu:latest
  EM_FIELD_IMAGE: ghcr.io/alexandrepedrosaai/edge-ai-app/electric-and-magnetic-field-circuits:26

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      asm_matrix: ${{ steps.generate.outputs.asm_matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: generate
        name: Generate per-file matrix
        run: |
          docker pull "$CLUSTERS_GPU_IMAGE"
          docker pull "$WEBGPU_IMAGE"
          docker pull "$EM_FIELD_IMAGE"
          asm_matrix=$(find WebGPU -maxdepth 1 -type f -name '*.asm' | sort | jq -R -s -c 'split("\n")[:-1] | map({asm_file: ., artifact: (split("/")[-1] | sub("\\.asm$";"") | ascii_downcase | gsub("[^a-z0-9]+";"-") | gsub("(^-|-$)";""))}) | {include:.}')
          echo "asm_matrix=$asm_matrix" >> "$GITHUB_OUTPUT"

  # Build de cada ASM em job isolado (sem build-all)
  build-per-file:
    runs-on: ubuntu-latest
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.asm_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM and Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          echo "EMSDK_PATH=$(pwd)" >> $GITHUB_ENV
          echo "$(pwd)/upstream/emscripten" >> $GITHUB_PATH
      - name: Setup Emscripten environment
        run: |
          source "$EMSDK_PATH/emsdk_env.sh"

      - name: Build ASM object and WASM (per file)
        run: |
          docker pull "$CLUSTERS_GPU_IMAGE"
          docker pull "$WEBGPU_IMAGE"
          docker pull "$EM_FIELD_IMAGE"
          set -euo pipefail
          mkdir -p release

          asm_file="${{ matrix.asm_file }}"
          artifact="${{ matrix.artifact }}"
          object_path="release/${artifact}.o"
          wasm_path="release/${artifact}.wasm"
          log_path="release/${artifact}.log"

          # 1. Compile ASM to Object file
          if nasm -f elf64 "$asm_file" -o "$object_path" 2>"$log_path"; then
            # 2. Convert Object to WASM using Emscripten (as in WebGPU.yml example)
            source "$EMSDK_PATH/emsdk_env.sh"
            if emcc "$object_path" -o "$wasm_path" -s STANDALONE_WASM --no-entry; then
              status="built"
              echo "Successfully built $wasm_path"
            else
              echo "Warning: Emcc failed for ${artifact}, creating placeholder"
              echo "Placeholder for ${artifact}" > "$wasm_path"
              status="built-with-placeholder"
            fi
            rm -f "$log_path"
          else
            status="not-buildable"
            echo "Nasm failed for ${asm_file}"
          fi

          jq -n \
            --arg source "$asm_file" \
            --arg artifact "$artifact" \
            --arg status "$status" \
            --arg object_path "$object_path" \
            --arg log_path "$log_path" \
            '{source: $source, artifact: $artifact, status: $status, object_path: $object_path, log_path: $log_path}' \
            > "release/${artifact}.json"
      - name: Upload per-file build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asm-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: ignore

  # Testes de integração por arquivo
  test-wasm:
    runs-on: ubuntu-latest
    needs: [prepare-matrix, build-per-file]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.asm_matrix) }}
    steps:
      - name: Download per-file build artifacts
        uses: actions/download-artifact@v4
        with:
          name: asm-${{ matrix.artifact }}
          path: release
      - name: Validate build output
        run: |
          docker pull "$CLUSTERS_GPU_IMAGE"
          docker pull "$WEBGPU_IMAGE"
          docker pull "$EM_FIELD_IMAGE"
          set -euo pipefail
          meta="release/${{ matrix.artifact }}.json"
          test -f "$meta"
          status=$(jq -r '.status' "$meta")

          if [ "$status" = "built" ]; then
            object_path=$(jq -r '.object_path' "$meta")
            test -s "$object_path"
            file "$object_path"
          else
            log_path=$(jq -r '.log_path' "$meta")
            test -s "$log_path"
            echo "Skipping execution for ${{ matrix.asm_file }} (not NASM buildable)."
          fi

  # Testes unitários por arquivo
  unit-tests:
    runs-on: ubuntu-latest
    needs: [prepare-matrix, test-wasm]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.asm_matrix) }}
    steps:
      - name: Download per-file tested artifacts
        uses: actions/download-artifact@v4
        with:
          name: asm-${{ matrix.artifact }}
          path: release
      - name: Validate metadata/output consistency
        run: |
          docker pull "$CLUSTERS_GPU_IMAGE"
          docker pull "$WEBGPU_IMAGE"
          docker pull "$EM_FIELD_IMAGE"
          set -euo pipefail
          meta="release/${{ matrix.artifact }}.json"
          test -f "$meta"
          jq -e '.source | endswith(".asm")' "$meta" > /dev/null
          status=$(jq -r '.status' "$meta")
          if [ "$status" = "built" ]; then
            object_path=$(jq -r '.object_path' "$meta")
            test -s "$object_path"
          else
            log_path=$(jq -r '.log_path' "$meta")
            test -s "$log_path"
          fi

  # Q-learning procedural por arquivo
  q-learning-test:
    runs-on: ubuntu-latest
    needs: [prepare-matrix, unit-tests]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.asm_matrix) }}
    steps:
      - name: Download per-file artifacts
        uses: actions/download-artifact@v4
        with:
          name: asm-${{ matrix.artifact }}
          path: release
      - name: Simulate Q-learning reward loop
        run: |
          docker pull "$CLUSTERS_GPU_IMAGE"
          docker pull "$WEBGPU_IMAGE"
          docker pull "$EM_FIELD_IMAGE"
          set -euo pipefail
          meta="release/${{ matrix.artifact }}.json"
          test -f "$meta"
          status=$(jq -r '.status' "$meta")

          reward=0
          for i in {1..5}; do
            if [ "$status" = "built" ]; then
              reward=$((reward+1))
            fi
          done
          echo "Final reward for ${{ matrix.asm_file }}: $reward"

  # Upload artefatos
  upload-artifacts:
    runs-on: ubuntu-latest
    needs: q-learning-test
    steps:
      - uses: actions/checkout@v4
      - name: Download per-file artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: asm-*
          merge-multiple: true
          path: release
      - uses: actions/upload-artifact@v4
        with:
          name: asm-binaries-tested
          path: release/*

  # Release automático
  release:
    runs-on: ubuntu-latest
    needs: upload-artifacts
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download tested ASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: asm-binaries-tested
          path: release
      - id: object-check
        name: Check compiled object and WASM files
        run: |
          docker pull "$CLUSTERS_GPU_IMAGE"
          docker pull "$WEBGPU_IMAGE"
          docker pull "$EM_FIELD_IMAGE"
          shopt -s nullglob
          objects=(release/*.o)
          wasm_files=(release/*.wasm)
          echo "Found ${#objects[@]} object files and ${#wasm_files[@]} WASM files."
          if [ ${#objects[@]} -gt 0 ] || [ ${#wasm_files[@]} -gt 0 ]; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Release
        if: ${{ steps.object-check.outputs.has_assets == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: neural-wasm-${{ github.run_number }}
          name: 🧠 LLM NEURAL ML DL PROCEDURAL Release #${{ github.run_number }}
          body: |
            🚀 **Automatic Neural Deployment**
            
            This release contains the latest WebAssembly neural modules and the silicon-colored 3D neural network integration.
            
            **Execution:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}
          files: |
            release/*.o
            release/*.wasm

  # Deploy para Edge-AI-APP
  deploy:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download tested ASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: asm-binaries-tested
          path: release
      - name: Copy object files to WEBASSEMBLY and docs
        run: |
          docker pull "$CLUSTERS_GPU_IMAGE"
          docker pull "$WEBGPU_IMAGE"
          docker pull "$EM_FIELD_IMAGE"
          shopt -s nullglob
          mkdir -p WEBASSEMBLY docs
          objects=(release/*.o)
          wasm_files=(release/*.wasm)
          if [ ${#objects[@]} -eq 0 ]; then
            echo "No object files to deploy."
            exit 0
          fi
          cp "${objects[@]}" WEBASSEMBLY/
          cp "${wasm_files[@]}" WEBASSEMBLY/
          cp "${objects[@]}" docs/
      - name: Update index.html with object file list
        run: |
          docker pull "$CLUSTERS_GPU_IMAGE"
          docker pull "$WEBGPU_IMAGE"
          docker pull "$EM_FIELD_IMAGE"
          shopt -s nullglob
          echo "<html><body><h1>Generated Object Files</h1><ul>" > docs/index.html
          for f in release/*.o; do
            fname=$(basename "$f")
            echo "<li>$fname (Object File)</li>" >> docs/index.html
          done
          for f in release/*.wasm; do
            fname=$(basename "$f")
            echo "<li>$fname (WASM File)</li>" >> docs/index.html
          done
          echo "</ul></body></html>" >> docs/index.html
      - name: Commit and push
        run: |
          docker pull "$CLUSTERS_GPU_IMAGE"
          docker pull "$WEBGPU_IMAGE"
          docker pull "$EM_FIELD_IMAGE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add WEBASSEMBLY docs
          git commit -m "Deploy WASM binaries and update docs [skip ci]"
          git push
