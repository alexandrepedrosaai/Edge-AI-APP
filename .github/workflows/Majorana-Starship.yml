name: Majorana Starship CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Cache + Build para cada file
      - name: Cache starshipquantumpro_fibonaccidashboard
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: fibo-${{ runner.os }}-${{ hashFiles('majorana-starship/starshipquantumpro_fibonaccidashboard.qs') }}
      - name: Build starshipquantumpro_fibonaccidashboard
        run: dotnet build majorana-starship/starshipquantumpro_fibonaccidashboard.qs -c Release

      - name: Cache starshipquantumpro_dashboard
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: dash-${{ runner.os }}-${{ hashFiles('majorana-starship/starshipquantumpro_dashboard.qs') }}
      - name: Build starshipquantumpro_dashboard
        run: dotnet build majorana-starship/starshipquantumpro_dashboard.qs -c Release

      - name: Cache starshipquantumproFQHE_dashboard
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: fqhe-${{ runner.os }}-${{ hashFiles('majorana-starship/starshipquantumproFQHE_dashboard.qs') }}
      - name: Build starshipquantumproFQHE_dashboard
        run: dotnet build majorana-starship/starshipquantumproFQHE_dashboard.qs -c Release

      - name: Cache starshipquantummission_dashboard
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: mission-${{ runner.os }}-${{ hashFiles('majorana-starship/starshipquantummission_dashboard.qs') }}
      - name: Build starshipquantummission_dashboard
        run: dotnet build majorana-starship/starshipquantummission_dashboard.qs -c Release

      - name: Cache starshipquantumadvanced_dashboard
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: adv-${{ runner.os }}-${{ hashFiles('majorana-starship/starshipquantumadvanced_dashboard.qs') }}
      - name: Build starshipquantumadvanced_dashboard
        run: dotnet build majorana-starship/starshipquantumadvanced_dashboard.qs -c Release

      - name: Cache starshipmissionenvironment
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: env-${{ runner.os }}-${{ hashFiles('majorana-starship/starshipmissionenvironment.qs') }}
      - name: Build starshipmissionenvironment
        run: dotnet build majorana-starship/starshipmissionenvironment.qs -c Release

      - name: Cache starshipmajoranamissionwithestimator
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: estimator-${{ runner.os }}-${{ hashFiles('majorana-starship/starshipmajoranamissionwithestimator.qs') }}
      - name: Build starshipmajoranamissionwithestimator
        run: dotnet build majorana-starship/starshipmajoranamissionwithestimator.qs -c Release

      - name: Cache resourceestimatortopoconductor
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: topo-${{ runner.os }}-${{ hashFiles('majorana-starship/resourceestimatortopoconductor.qs') }}
      - name: Build resourceestimatortopoconductor
        run: dotnet build majorana-starship/resourceestimatortopoconductor.qs -c Release

      - name: Cache lunarstarshipmission
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: lunar-${{ runner.os }}-${{ hashFiles('majorana-starship/lunarstarshipmission.qs') }}
      - name: Build lunarstarshipmission
        run: dotnet build majorana-starship/lunarstarshipmission.qs -c Release

      - name: Cache braidingmzmsimulation
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: mzm-${{ runner.os }}-${{ hashFiles('majorana-starship/braidingmzmsimulation.qs') }}
      - name: Build braidingmzmsimulation
        run: dotnet build majorana-starship/braidingmzmsimulation.qs -c Release

      - name: Cache braidingcryptographysimulation
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: crypto-${{ runner.os }}-${{ hashFiles('majorana-starship/braidingcryptographysimulation.qs') }}
      - name: Build braidingcryptographysimulation
        run: dotnet build majorana-starship/braidingcryptographysimulation.qs -c Release

      - name: Cache UltraFQHEAnimation
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ultra-${{ runner.os }}-${{ hashFiles('majorana-starship/UltraFQHEAnimation.qs') }}
      - name: Build UltraFQHEAnimation
        run: dotnet build majorana-starship/UltraFQHEAnimation.qs -c Release

      - name: Cache TopologicoQuantumProceduralNeuralMLDL
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: topo-ml-${{ runner.os }}-${{ hashFiles('majorana-starship/TopologicoQuantumProceduralNeuralMLDL.qs') }}
      - name: Build TopologicoQuantumProceduralNeuralMLDL
        run: dotnet build majorana-starship/TopologicoQuantumProceduralNeuralMLDL.qs -c Release

      - name: Cache ImprovedAnyonicBraiding
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: imp-${{ runner.os }}-${{ hashFiles('majorana-starship/ImprovedAnyonicBraiding.qs') }}
      - name: Build ImprovedAnyonicBraiding
        run: dotnet build majorana-starship/ImprovedAnyonicBraiding.qs -c Release

      - name: Cache AdvancedAnyonicBraiding
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: adv-braid-${{ runner.os }}-${{ hashFiles('majorana-starship/AdvancedAnyonicBraiding.qs') }}
      - name: Build AdvancedAnyonicBraiding
        run: dotnet build majorana-starship/AdvancedAnyonicBraiding.qs -c Release

      - name: Cache DQNN
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: dqnn-${{ runner.os }}-${{ hashFiles('majorana-starship/DQNN.qs') }}
      - name: Build DQNN
        run: dotnet build majorana-starship/DQNN.qs -c Release

      # Publicação dos binários
      - name: Publish binaries
        run: |
          mkdir -p majorana-starship/bin_output
          dotnet publish majorana-starship -c Release -o majorana-starship/bin_output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: majorana-starship-binaries
          path: majorana-starship/bin_output
docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./majorana-starship
          file: ./majorana-starship/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/majorana-starship:latest
    quantum-polymorphism:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Quantum Polymorphism Exhaustive Functions
        run: |
          echo "🔬 Polimorfismo exaustivo:"
