name: Go Multi-OS CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Go Binary (Multi-OS)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Instalar dependências
        run: go mod tidy

      - name: Rodar testes
        run: go test ./cmd/... ./internal/... -v

      - name: Compilar binário (Linux/macOS)
        if: runner.os != 'Windows'
        run: go build -o app-${{ matrix.os }} ./cmd/app

      - name: Compilar binário (Windows)
        if: runner.os == 'Windows'
        run: go build -o app-${{ matrix.os }}.exe ./cmd/app

      - name: Gerar SHA256 (Linux/macOS)
        if: runner.os != 'Windows'
        run: sha256sum app-${{ matrix.os }} > app-${{ matrix.os }}.sha256

      - name: Gerar SHA256 (Windows)
        if: runner.os == 'Windows'
        run: certutil -hashfile app-${{ matrix.os }}.exe SHA256 > app-${{ matrix.os }}.sha256

      - name: Upload artefatos (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: go-binary-${{ matrix.os }}
          path: |
            app-${{ matrix.os }}
            app-${{ matrix.os }}.sha256

      - name: Upload artefatos (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: go-binary-${{ matrix.os }}
          path: |
            app-${{ matrix.os }}.exe
            app-${{ matrix.os }}.sha256

  release:
    name: Criar Release Automática
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Download binários Linux
        uses: actions/download-artifact@v4
        with:
          name: go-binary-ubuntu-latest

      - name: Download binários Windows
        uses: actions/download-artifact@v4
        with:
          name: go-binary-windows-latest

      - name: Download binários macOS
        uses: actions/download-artifact@v4
        with:
          name: go-binary-macos-latest

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: go-multi-os-latest
          name: "Go Multi-OS Edge AI App — Latest Build"
          body: |
            Automated multi-OS Go binary build.

            **Commit:** ${{ github.sha }}

            | Binary | OS |
            |--------|----|
            | `app-ubuntu-latest` | Linux x86_64 |
            | `app-windows-latest.exe` | Windows x86_64 |
            | `app-macos-latest` | macOS x86_64 |
          files: |
            app-ubuntu-latest
            app-ubuntu-latest.sha256
            app-windows-latest.exe
            app-windows-latest.sha256
            app-macos-latest
            app-macos-latest.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
