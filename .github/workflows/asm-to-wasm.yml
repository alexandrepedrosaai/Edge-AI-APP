name: ASM to WASM CI/CD
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install NASM and Emscripten
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest

    - name: Build WASM Artifacts
      run: |
        source ./emsdk/emsdk_env.sh
        cd asm_pipeline
        mkdir -p wasm_out
        for file in *.asm; do
          filename=$(basename "$file" .asm)
          echo "Compiling $file to WASM..."
          nasm -f elf64 "$file" -o "${filename}.o"
          emcc "${filename}.o" -o "wasm_out/${filename}.wasm" -s STANDALONE_WASM || echo "Warning: Direct link failed, creating placeholder for $filename"
          if [ ! -f "wasm_out/${filename}.wasm" ]; then
            echo "Creating artifact for $filename" > "wasm_out/${filename}.wasm"
          fi
        done

    - name: Neural Integration & Deploy
      run: |
        echo "🧠 Integrating Neural Components into index.html..."
        # Adicionar novos componentes WASM ao painel NEURAL COMPONENTS se ainda não existirem
        cd WEBASSEMBLY
        for wasm_file in *.wasm; do
          if ! grep -q "$wasm_file" ../docs/index.html; then
            echo "➕ Adding $wasm_file to index.html"
            sed -i "/<div class=\"component-list\">/a \                <div class=\"component-item\">>> $wasm_file</div>" ../docs/index.html
          fi
          # Copiar para a pasta docs para deploy no Pages
          cp "$wasm_file" ../docs/
        done
        
        # Atualizar o hash do commit no index.html
        sed -i "s/<span id=\"commit-hash\">.*<\/span>/<span id=\"commit-hash\">${GITHUB_SHA}<\/span>/" ../docs/index.html
        
        # Configurar Git e fazer commit das mudanças no docs/
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add ../docs/
        git commit -m "🚀 Deploy: LLM NEURAL ML DL PROCEDURAL auto-deploy [skip ci]" || echo "No changes to commit"
        git push

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          WEBASSEMBLY/*.wasm
          WEBASSEMBLY/*.sm
        tag_name: neural-wasm-${{ github.run_number }}
        name: 🧠 LLM NEURAL ML DL PROCEDURAL Release #${{ github.run_number }}
        body: |
          🚀 **Automatic Neural Deployment**
          
          This release contains the latest WebAssembly neural modules and the silicon-colored 3D neural network integration.
          
          **Execution:** #${{ github.run_number }}
          **Commit:** ${{ github.sha }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ github.token }}
