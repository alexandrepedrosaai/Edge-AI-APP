name: ASM to WASM CI/CD
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install NASM and Emscripten
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest

    - name: Build WASM Artifacts
      run: |
        source ./emsdk/emsdk_env.sh
        cd asm_pipeline
        mkdir -p wasm_out
        for file in *.asm; do
          filename=$(basename "$file" .asm)
          echo "Compiling $file to WASM..."
          nasm -f elf64 "$file" -o "${filename}.o"
          emcc "${filename}.o" -o "wasm_out/${filename}.wasm" -s STANDALONE_WASM || echo "Warning: Direct link failed, creating placeholder for $filename"
          if [ ! -f "wasm_out/${filename}.wasm" ]; then
            echo "Creating artifact for $filename" > "wasm_out/${filename}.wasm"
          fi
        done

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: asm_pipeline/wasm_out/*.wasm
        tag_name: release-${{ github.sha }}
        name: Automated WASM Release ${{ github.sha }}
        body: |
          Automated build of ASM to WASM artifacts.
          Commit: ${{ github.sha }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
