name: Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            python3-dev \
            nasm \
            yasm \
            binutils \
            gcc \
            g++ || true
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install Node.js dependencies
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "Installing with pnpm (frozen lockfile)..."
            pnpm install --frozen-lockfile
          elif [ -f "package.json" ]; then
            echo "Installing with pnpm..."
            pnpm install
          else
            echo "No package.json found"
          fi
      
      - name: Install Python dependencies
        run: |
          if [ -f "requirements.txt" ]; then
            echo "Installing Python dependencies..."
            python3 -m pip install --upgrade pip -q
            pip install -r requirements.txt -q
          fi
      
      - name: Check TypeScript
        run: |
          if grep -q '"check"' package.json 2>/dev/null; then
            echo "Running TypeScript check..."
            pnpm run check || true
          fi
      
      - name: Format check
        run: |
          if grep -q '"format"' package.json 2>/dev/null; then
            echo "Running format check..."
            pnpm run format --check || true
          fi
      
      - name: Build project with Vite
        env:
          VITE_ANALYTICS_ENDPOINT: "https://analytics.example.com"
          VITE_ANALYTICS_WEBSITE_ID: "default"
          VITE_APP_TITLE: "Edge AI App"
          VITE_APP_LOGO: "/logo.svg"
        run: |
          if grep -q '"build"' package.json 2>/dev/null; then
            echo "Building project with Vite..."
            pnpm run build
          else
            echo "No build script found"
          fi
      
      - name: Build Assembly
        run: |
          if [ -f "build-assembly.sh" ]; then
            echo "Building Assembly..."
            chmod +x build-assembly.sh
            ./build-assembly.sh x86_64 linux || true
          fi
      
      - name: Run tests
        run: |
          if grep -q '"test"' package.json 2>/dev/null; then
            echo "Running tests..."
            pnpm run test || true
          fi
      
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-node${{ matrix.node-version }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Create build summary
        if: always()
        run: |
          echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Environment" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "- npm: $(npm --version)" >> $GITHUB_STEP_SUMMARY
          echo "- pnpm: $(pnpm --version)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Status" >> $GITHUB_STEP_SUMMARY
          if [ -d "dist" ]; then
            echo "✓ Build completed successfully" >> $GITHUB_STEP_SUMMARY
            echo "- Output: dist/" >> $GITHUB_STEP_SUMMARY
            echo "- Size: $(du -sh dist/ | cut -f1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠ Build output not found" >> $GITHUB_STEP_SUMMARY
          fi
