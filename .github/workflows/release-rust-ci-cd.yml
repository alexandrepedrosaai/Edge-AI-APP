name: Rust CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build project
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-app-rust
          path: target/release/

  release:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build release binaries
        run: cargo build --release

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/release/*
