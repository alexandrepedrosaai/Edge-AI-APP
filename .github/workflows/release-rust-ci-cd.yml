name: Rust CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-Writer-CherryGarden-Ressonance-Copilot-Meta-AI/rust-core
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build project
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-app-rust
          path: AI-Writer-CherryGarden-Ressonance-Copilot-Meta-AI/rust-core/target/release/

  release:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'release'
    defaults:
      run:
        working-directory: AI-Writer-CherryGarden-Ressonance-Copilot-Meta-AI/rust-core
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: AI-Writer-CherryGarden-Ressonance-Copilot-Meta-AI/rust-core/target/release/*
