name: Rust CI/CD Matrix

on:
  push:
    branches: [ "main" ]
  release:
    types: [created]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            rust: nightly
            target: x86_64-unknown-linux-gnu
            use_cross: false
          # Linux aarch64 (cross-compile)
          - os: ubuntu-latest
            rust: stable
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: ubuntu-latest
            rust: nightly
            target: aarch64-unknown-linux-gnu
            use_cross: true
          # Windows x86_64
          - os: windows-latest
            rust: stable
            target: x86_64-pc-windows-msvc
            use_cross: false
          - os: windows-latest
            rust: nightly
            target: x86_64-pc-windows-msvc
            use_cross: false
          # macOS x86_64
          - os: macos-latest
            rust: stable
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            rust: nightly
            target: x86_64-apple-darwin
            use_cross: false
          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            rust: stable
            target: aarch64-apple-darwin
            use_cross: false
          - os: macos-latest
            rust: nightly
            target: aarch64-apple-darwin
            use_cross: false

    defaults:
      run:
        working-directory: AI-Writer-CherryGarden-Ressonance-Copilot-Meta-AI/rust-core

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build project (native)
        if: matrix.use_cross == false
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build project (cross)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Run tests (native only)
        if: matrix.use_cross == false
        run: cargo test --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-app-${{ matrix.target }}-${{ matrix.rust }}
          path: AI-Writer-CherryGarden-Ressonance-Copilot-Meta-AI/rust-core/target/${{ matrix.target }}/release/
