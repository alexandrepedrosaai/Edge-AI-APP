name: HDL CI | CD Multi-OS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-hdl:
    name: Build HDL (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install HDL tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ghdl iverilog

      - name: Install HDL tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ghdl icarus-verilog

      - name: Create output directory
        run: mkdir -p fpga_build

      - name: Compile VHDL (analyse + elaborate)
        run: |
          ghdl -a --std=08 src/vhdl/top_entity.vhd
          ghdl -a --std=08 tests/tb_top.vhd
          ghdl -e --std=08 tb_top

      - name: Run VHDL simulation (generate waveform)
        run: |
          ghdl -r --std=08 tb_top \
            --vcd=fpga_build/wave_${{ matrix.os }}.vcd \
            --stop-time=500ns 2>&1 | tee fpga_build/vhdl_sim_${{ matrix.os }}.log || true

      - name: Compile Verilog design + testbench
        run: |
          iverilog -o fpga_build/verilog_sim_${{ matrix.os }} \
            src/verilog/top_entity.v \
            tests/tb_top.v

      - name: Run Verilog simulation
        run: |
          cd fpga_build
          ./verilog_sim_${{ matrix.os }} 2>&1 | tee verilog_sim_${{ matrix.os }}.log || true

      - name: Upload HDL artifacts (${{ matrix.os }})
        uses: actions/upload-artifact@v4
        with:
          name: hdl-artifacts-${{ matrix.os }}
          path: |
            fpga_build/wave_${{ matrix.os }}.vcd
            fpga_build/tb_top.vcd
            fpga_build/vhdl_sim_${{ matrix.os }}.log
            fpga_build/verilog_sim_${{ matrix.os }}.log

  release:
    name: Package & Release
    runs-on: ubuntu-latest
    needs: build-hdl
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download Ubuntu artifacts
        uses: actions/download-artifact@v4
        with:
          name: hdl-artifacts-ubuntu-latest
          path: release-files/ubuntu/
        continue-on-error: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: hdl-artifacts-macos-latest
          path: release-files/macos/
        continue-on-error: true

      - name: List all release files
        run: find release-files/ -type f | sort

      - name: Package all artifacts
        run: |
          zip -r release-files/hdl-multi-os-artifacts.zip release-files/ -x "*.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: hdl-multi-os-latest
          name: "HDL Multi-OS Build — Latest"
          body: |
            Automated HDL simulation build across multiple operating systems.

            **Commit:** ${{ github.sha }}

            ## Platforms
            | OS | VHDL Simulator | Verilog Simulator |
            |----|---------------|-------------------|
            | Ubuntu | GHDL | Icarus Verilog |
            | macOS | GHDL (Homebrew) | Icarus Verilog (Homebrew) |

            ## Artifacts
            | File | Description |
            |------|-------------|
            | `hdl-multi-os-artifacts.zip` | All waveforms and logs from all platforms |
          files: |
            release-files/hdl-multi-os-artifacts.zip
          prerelease: false
