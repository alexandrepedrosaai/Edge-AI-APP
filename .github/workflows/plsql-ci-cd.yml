name: PL/SQL CI/CD EdgeAIApp

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-free:latest
        env:
          ORACLE_PASSWORD: root
        ports:
          - 1521:1521

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Wait for Oracle to be ready
      run: |
        echo "Waiting for Oracle database to start..."
        # This loop waits for the database to be ready to accept connections
        timeout 300s bash -c 'until echo exit | sqlplus -L system/root@localhost:1521/FREE; do sleep 5; done' || true    - name: Install Oracle Instant Client
     
        run: |
        sudo apt-get update
        sudo apt-get install -y libaio1 wget unzip
        wget https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linux.x64-21.9.0.0.0dbru.zip
        wget https://download.oracle.com/otn_software/linux/instantclient/instantclient-sqlplus-linux.x64-21.9.0.0.0dbru.zip
        unzip instantclient-basiclite-linux.x64-21.9.0.0.0dbru.zip
        unzip instantclient-sqlplus-linux.x64-21.9.0.0.0dbru.zip
        export LD_LIBRARY_PATH=$PWD/instantclient_21_9:$LD_LIBRARY_PATH
        export PATH=$PWD/instantclient_21_9:$PATH
        - name: Apply PL/SQL scripts
        run: |
        # Apply schema, seed data, and then the procedural logic
        sqlplus system/root@localhost:1521/FREE @SQL/edgeaischema.sql
        sqlplus system/root@localhost:1521/FREE @SQL/edgeaiseed.sql
        sqlplus system/root@localhost:1521/FREE @SQL-PL/edgeaiprocedures.sql

    - name: Package PL/SQL artifacts
      run: |
        mkdir -p build/plsql
        cp SQL/*.sql build/plsql/
        cp SQL-PL/*.sql build/plsql/

    - name: Upload PL/SQL artifacts
      uses: actions/upload-artifact@v4
      with:
        name: plsql-artifacts
        path: build/plsql/

    - name: Create automatic release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: "EdgeAIApp PL/SQL Release ${{ github.run_number }}"
        body: |
          🚀 Automatic PL/SQL Release
          Includes schema, seed, and procedural logic for EdgeAIApp.
        files: build/plsql/*.sql
