name: R CI/CD Edge AI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.1'

    - name: Install dependencies
      run: |
        Rscript -e 'install.packages(c("testthat","tidyverse"), repos="https://cloud.r-project.org")'

    - name: Run Edge AI sensor demo
      run: Rscript edge_ai_sensor.R

    - name: Run Edge AI inference demo
      run: Rscript edge_ai_inference.R

    - name: Run Edge AI pipeline tests
      run: Rscript edge_ai_pipeline_test.R

    - name: Create release with R files
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: "Edge AI R Release ${{ github.run_number }}"
        body: |
          🎉 Automatic R CI/CD Release
          Includes Edge AI sensor simulation, inference demo, and pipeline tests.
        files: |
          edgeaisensor.R
          edgeaiinference.R
          edgeaipipeline_test.R
