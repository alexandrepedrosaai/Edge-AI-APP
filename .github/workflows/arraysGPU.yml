name: arraysGPU and Clusters CI/CD

on:
  push:
    branches:
      - main

concurrency:
  group: arraysgpu-release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 1: Pull base Docker image
      - name: Pull WebGPU base image
        run: docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/webgpu:latest

      # Step 2: Prepare build folder
      - name: Prepare build folder
        run: mkdir -p build/bin

      # Step 3: Copy source files
      - name: Copy source files
        run: |
          cp WebGPU/ArraysGPU.wgsl build/bin/
          cp WebGPU/Clusters.wgsl build/bin/
          cp WebGPU/arraysGPU.js build/bin/
          cp WebGPU/clustersASM.asm build/bin/
          cp WebGPU/dashboard.js build/bin/
          cp WebGPU/websocket.js build/bin/
          cp WebGPU/index.html build/bin/

      # Step 4: Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arraysGPU-binaries
          path: build/bin/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: arraysGPU-binaries
          path: release/bin

      # Step 5: Deploy artifacts into repo folders
      - name: Deploy artifacts into folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            cp release/bin/* WebGPU/
            cp release/bin/* docs/
            cp release/bin/index.html docs/index.html
            cp release/bin/* WEBASSEMBLY/

            git add WebGPU docs WEBASSEMBLY

            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "chore(ci): deploy arraysGPU binaries via github-actions[bot]" && \
            git push origin HEAD:main && exit 0

            git reset --hard HEAD~1 || true
            sleep 2
          done

          echo "Failed to push after retries"
          exit 1

      # Step 6: Automated release tagging
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Automated Release ${{ github.run_number }}"
          files: release/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site content
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  docker:
    needs: pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 7: Build Docker image with clusters-arrays-gpu name
      - name: Build Docker image
        run: docker build -t ghcr.io/alexandrepedrosaai/edge-ai-app/clusters-arrays-gpu:${{ github.run_number }} .

      - name: Push Docker image
        run: docker push ghcr.io/alexandrepedrosaai/edge-ai-app/clusters-arrays-gpu:${{ github.run_number }}
