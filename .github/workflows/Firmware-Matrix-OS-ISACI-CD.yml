name: CI-CD Matrix OS-ISA Firmware Releases

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-firmware:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        isa: [x86, arm, riscv]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup toolchain
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y nasm
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install nasm
          else
            choco install nasm -y
          fi

      - name: Build Firmware Tables
        run: |
          mkdir -p build/${{ matrix.isa }}
          TARGET_FILE="src/firmware/main_${{ matrix.isa }}.firmware"
          
          if [ -f "$TARGET_FILE" ]; then
            echo "Building $TARGET_FILE for ${{ matrix.isa }}..."
            out="build/${{ matrix.isa }}/main-${{ matrix.isa }}.rom"
            
            if [ "${{ matrix.isa }}" = "x86" ]; then
              nasm -f bin "$TARGET_FILE" -o "$out"
            else
              echo "Skipping assembly for ${{ matrix.isa }} as cross-compilers are not configured."
              touch "$out.skipped"
            fi
            
            if [ -f "$out" ]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$out" > "$out.sha256"
              else
                shasum -a 256 "$out" > "$out.sha256"
              fi
            fi
          else
            echo "No firmware file found for ${{ matrix.isa }}"
          fi

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.os }}-${{ matrix.isa }}
          path: build/${{ matrix.isa }}/*

  release:
    needs: build-firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Manifest JSON
        run: |
          echo "[" > manifest.json
          FIRST=true
          find ./artifacts -name '*.rom' | while read f; do
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo "," >> manifest.json
            fi
            HASH=$(sha256sum "$f" | cut -d ' ' -f1)
            SIZE=$(stat -c%s "$f")
            DIRNAME=$(basename $(dirname "$f"))
            echo -n "  {\"file\":\"$(basename $f)\",\"osisa\":\"$DIRNAME\",\"size\":$SIZE,\"sha256\":\"$HASH\"}" >> manifest.json
          done
          echo "" >> manifest.json
          echo "]" >> manifest.json

      - name: Create Tag
        id: tag
        run: |
          # Use run_number and run_attempt to ensure uniqueness
          TAG="v$(date +'%Y.%m.%d')-run${{ github.run_number }}-att${{ github.run_attempt }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Check if tag exists locally or remotely
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, appending timestamp"
            TAG="${TAG}-$(date +%H%M%S)"
          fi
          
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Firmware Matrix Release ${{ steps.tag.outputs.tag }}"
          body: |
            Automated multi-OS / multi-ISA firmware release.
            Includes SHA256 hashes and manifest.json for integrity verification.
            Commit: ${{ github.sha }}
          files: |
            ./artifacts/**/*
            manifest.json
