name: CI-CD Matrix OS-ISA Firmware Releases

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-firmware:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        isa: [x86, arm, riscv]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup toolchain
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y nasm
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install nasm
          else
            choco install nasm -y
          fi

      - name: Build Firmware Tables
        run: |
          mkdir -p build/${{ matrix.isa }}
          # Check if directory exists and has files to avoid errors
          if [ -d "src/firmware" ]; then
            for src in src/firmware/*.firmware; do
              if [ -f "$src" ]; then
                base=$(basename "$src" .firmware)
                out="build/${{ matrix.isa }}/${base}-${{ matrix.isa }}.rom"
                nasm -f bin "$src" -o "$out"
                # Use sha256sum or shasum depending on availability
                if command -v sha256sum >/dev/null 2>&1; then
                  sha256sum "$out" > "$out.sha256"
                else
                  shasum -a 256 "$out" > "$out.sha256"
                fi
              fi
            done
          fi

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.os }}-${{ matrix.isa }}
          path: build/${{ matrix.isa }}/*

  release:
    needs: build-firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Manifest JSON
        run: |
          echo "[" > manifest.json
          # Find all .rom files and generate manifest
          find ./artifacts -name '*.rom' | while read f; do
            HASH=$(sha256sum "$f" | cut -d ' ' -f1)
            SIZE=$(stat -c%s "$f")
            # Extract OS/ISA from the path
            # Path is usually ./artifacts/firmware-<os>-<isa>/<file>.rom
            DIRNAME=$(basename $(dirname "$f"))
            echo "  {\"file\":\"$(basename $f)\",\"osisa\":\"$DIRNAME\",\"size\":$SIZE,\"sha256\":\"$HASH\"}," >> manifest.json
          done
          # Remove trailing comma from the last entry if it exists
          if [ -s manifest.json ]; then
            sed -i '$ s/,$//' manifest.json
          fi
          echo "]" >> manifest.json

      - name: Create Tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-run${{ github.run_number }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Firmware Matrix Release ${{ steps.tag.outputs.tag }}"
          body: |
            Automated multi-OS / multi-ISA firmware release.
            Includes SHA256 hashes and manifest.json for integrity verification.
            Commit: ${{ github.sha }}
          files: |
            ./artifacts/**/*
            manifest.json
