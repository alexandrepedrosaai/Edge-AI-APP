name: EdgeAi CI/CD .D

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Generate Build Document (.D)
      run: |
        echo "# EdgeAiBuild.D" > EdgeAiBuild.D
        echo "Automated Build Document" >> EdgeAiBuild.D
        echo "Version: v${{ github.run_number }}" >> EdgeAiBuild.D
        echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> EdgeAiBuild.D
        echo "Integrity:" >> EdgeAiBuild.D
        echo "SHA256 Hash:" >> EdgeAiBuild.D
        find . -maxdepth 1 -type f -exec sha256sum {} + >> EdgeAiBuild.D

    - name: Upload Build Document
      uses: actions/upload-artifact@v4
      with:
        name: edge-ai-build-doc
        path: EdgeAiBuild.D

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download Build Document
      uses: actions/download-artifact@v4
      with:
        name: edge-ai-build-doc
        path: ./release

    - name: Generate Release Document (.D)
      run: |
        echo "# EdgeAiRelease.D" > EdgeAiRelease.D
        echo "Automated Release Document" >> EdgeAiRelease.D
        echo "Version: v${{ github.run_number }}" >> EdgeAiRelease.D
        echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> EdgeAiRelease.D
        echo "Attached Files: EdgeAiBuild.D" >> EdgeAiRelease.D
        echo "Duality:" >> EdgeAiRelease.D
        echo "- Public registry: GitHub Release" >> EdgeAiRelease.D
        echo "- Private palace: Azure execution" >> EdgeAiRelease.D

    - name: Create automated release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: "EdgeAi Release ${{ github.run_number }}"
        body: |
          🚀 Automated release generated by CI/CD pipeline
          - Build Document (.D) included
          - Release Document (.D) included
        files: ./release/**
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
