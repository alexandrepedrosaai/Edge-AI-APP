name: CI/CD Groovy Edge-AI-APP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: edge-ai-app
      VERSION: 1.0.${{ github.run_number }}

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build
      run: ./gradlew clean build

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Package Binary
      run: |
        mkdir -p artifacts
        cp build/libs/${APP_NAME}.jar artifacts/${APP_NAME}-${VERSION}.jar

    - name: Docker Build
      run: docker build -t edge-ai-app:${VERSION} .

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION }}
        files: artifacts/${APP_NAME}-${VERSION}.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
