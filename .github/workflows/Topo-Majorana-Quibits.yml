name: Topo-Majorana-Quibits CI CD

on:
  push:
    branches:
      - main

jobs:
  prepare-build:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set-projects.outputs.projects }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Pull required Docker images
        run: |
          docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/webgpu:latest
          docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/clusters-arrays-gpu:66
          docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/electric-and-magnetic-field-circuits:48

      - name: Get list of Q# projects
        id: set-projects
        run: |
          PROJECTS=$(find WebGPU/Majoran-Starship/ -name "*.csproj" -printf "%f\n" | jq -R -s -c ".split(\'\\n\') | map(select(length > 0))")
          echo "projects=$PROJECTS" >> $GITHUB_OUTPUT

  build-projects:
    needs: prepare-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJson(needs.prepare-build.outputs.projects) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Q# environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: 'WebGPU/Majoran-Starship/${{ matrix.project }}'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles(format('WebGPU/Majoran-Starship/{0}', matrix.project)) }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies for ${{ matrix.project }}
        run: |
          cd WebGPU/Majoran-Starship
          dotnet restore "${{ matrix.project }}"

      - name: Build ${{ matrix.project }}
        run: |
          cd WebGPU/Majoran-Starship
          echo "Building ${{ matrix.project }}"
          DOTNET_ROLL_FORWARD=Major dotnet build "${{ matrix.project }}" --no-restore -c Release

      - name: Run ${{ matrix.project }}
        run: |
          cd WebGPU/Majoran-Starship
          echo "Running ${{ matrix.project }}"
          DOTNET_ROLL_FORWARD=Major dotnet run --no-build -c Release --project "${{ matrix.project }}" || echo "Skipping run failure for ${{ matrix.project }}"

      - name: Upload ${{ matrix.project }} build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-build-output
          path: WebGPU/Majoran-Starship/bin/Release/

  package-and-release:
    needs: build-projects
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package all files and binaries
        run: |
          mkdir -p majorana-starship-full-package
          cp -r WebGPU/Majoran-Starship/ majorana-starship-full-package/
          find artifacts -name "*.dll" -exec cp {} majorana-starship-full-package/WebGPU/Majoran-Starship/bin/Release/ \; || true
          zip -r majorana-starship-full-package.zip majorana-starship-full-package/

      - name: Create release tag
        id: tag
        run: |
          VERSION="v$(date +'%Y.%m.%d.%H%M')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $VERSION
          git push origin $VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "Topo-Majorana-Quibits Release ${{ steps.tag.outputs.version }}"
          body: "Automated release containing all binaries and source files for Majorana Starship."
          files: majorana-starship-full-package.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: package-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: WebGPU/Majoran-Starship
          file: WebGPU/Majoran-Starship/Dockerfile
          push: false
          tags: topo-majorana-quibits:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Push Docker image to GitHub Container Registry
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag topo-majorana-quibits:latest ghcr.io/${{ github.repository }}/topo-majorana-quibits:latest
          docker push ghcr.io/${{ github.repository }}/topo-majorana-quibits:latest
