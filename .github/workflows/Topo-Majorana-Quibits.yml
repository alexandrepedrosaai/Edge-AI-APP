name: Topo-Majorana-Quibits CI CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Q# environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pull required Docker images
        run: |
          docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/webgpu:latest
          docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/clusters-arrays-gpu:66
          docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/electric-and-magnetic-field-circuits:48

      - name: Build all MajoranaStarship files
        run: |
          cd WebGPU/Majoran-Starship
          for project in *.csproj; do
            echo "Building $project"
            DOTNET_ROLL_FORWARD=Major dotnet build "$project"
          done

      - name: Run all MajoranaStarship files
        run: |
          cd WebGPU/Majoran-Starship
          for project in *.csproj; do
            echo "Running $project"
            DOTNET_ROLL_FORWARD=Major dotnet run --no-build --project "$project" || echo "Skipping run failure for $project"
          done

      - name: Upload all Q# binaries artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: majorana-quibits-binaries
          path: 'WebGPU/Majoran-Starship/**/bin/**'

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release tag
        id: tag
        run: |
          VERSION="v$(date +'%Y.%m.%d.%H%M')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          git tag $VERSION
          git push origin $VERSION

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "Topo-Majorana-Quibits Release ${{ steps.tag.outputs.version }}"
          files: 'WebGPU/Majoran-Starship/**/bin/**'

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t topo-majorana-quibits:latest -f WebGPU/Majoran-Starship/Dockerfile WebGPU/Majoran-Starship

      - name: Push Docker image to GitHub Container Registry
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag topo-majorana-quibits:latest ghcr.io/${{ github.repository }}/topo-majorana-quibits:latest
          docker push ghcr.io/${{ github.repository }}/topo-majorana-quibits:latest
