name: Topo-Majorana-Quibits CI CD

on:
  push:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set matrix
        id: set-matrix
        run: |
          cd WebGPU/Majoran-Starship
          PROJECTS=$(ls *.csproj | grep -v "MajoranaStarshipQuantumInfinity.csproj" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$PROJECTS" >> $GITHUB_OUTPUT

  build-and-run:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Q# environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: 'WebGPU/Majoran-Starship/${{ matrix.project }}'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ matrix.project }}-${{ hashFiles(format('WebGPU/Majoran-Starship/{0}', matrix.project)) }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ matrix.project }}-

      - name: Double Cache (bin and obj folders)
        uses: actions/cache@v4
        with:
          path: |
            WebGPU/Majoran-Starship/bin
            WebGPU/Majoran-Starship/obj
          key: ${{ runner.os }}-dotnet-build-${{ matrix.project }}-${{ hashFiles('WebGPU/Majoran-Starship/*.qs', format('WebGPU/Majoran-Starship/{0}', matrix.project)) }}
          restore-keys: |
            ${{ runner.os }}-dotnet-build-${{ matrix.project }}-

      - name: Restore dependencies
        run: |
          cd WebGPU/Majoran-Starship
          dotnet restore "${{ matrix.project }}"

      - name: Cache Docker Images
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: ${{ runner.os }}-docker-images-${{ hashFiles('.github/workflows/Topo-Majorana-Quibits.yml') }}

      - name: Load Docker Images from Cache
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          if [ -f /tmp/docker-images/images.tar ]; then
            docker load -i /tmp/docker-images/images.tar
          fi

      - name: Pull required Docker images
        run: |
          docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/webgpu:latest
          docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/clusters-arrays-gpu:66
          docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/electric-and-magnetic-field-circuits:48

      - name: Save Docker Images to Cache
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-images
          docker save \
            ghcr.io/alexandrepedrosaai/edge-ai-app/webgpu:latest \
            ghcr.io/alexandrepedrosaai/edge-ai-app/clusters-arrays-gpu:66 \
            ghcr.io/alexandrepedrosaai/edge-ai-app/electric-and-magnetic-field-circuits:48 \
            -o /tmp/docker-images/images.tar

      - name: Build project
        run: |
          cd WebGPU/Majoran-Starship
          DOTNET_ROLL_FORWARD=Major dotnet build "${{ matrix.project }}" --no-restore -c Release

      - name: Run project
        run: |
          cd WebGPU/Majoran-Starship
          DOTNET_ROLL_FORWARD=Major dotnet run --no-build -c Release --project "${{ matrix.project }}" || echo "Skipping run failure for ${{ matrix.project }}"

      - name: Package project artifacts
        run: |
          cd WebGPU/Majoran-Starship
          zip -r "${{ matrix.project }}-artifacts.zip" . -i "${{ matrix.project }}" "bin/*" "obj/*" "*.qs"

      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-artifact
          path: WebGPU/Majoran-Starship/${{ matrix.project }}-artifacts.zip

  release:
    needs: build-and-run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create unified package
        run: |
          zip -r majorana-starship-full-package.zip all-artifacts/

      - name: Create release tag
        id: tag
        run: |
          VERSION="v$(date +'%Y.%m.%d.%H%M')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $VERSION
          git push origin $VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "Topo-Majorana-Quibits Release ${{ steps.tag.outputs.version }}"
          body: "Automated parallel release containing all binaries and source files for Majorana Starship."
          files: majorana-starship-full-package.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: WebGPU/Majoran-Starship
          file: WebGPU/Majoran-Starship/Dockerfile
          push: false
          tags: topo-majorana-quibits:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Push Docker image to GitHub Container Registry
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag topo-majorana-quibits:latest ghcr.io/${{ github.repository }}/topo-majorana-quibits:latest
          docker push ghcr.io/${{ github.repository }}/topo-majorana-quibits:latest
          
