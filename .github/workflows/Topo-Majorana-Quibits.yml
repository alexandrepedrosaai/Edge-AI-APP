name: Topo-Majorana-Quibits CI CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Q# environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pull required Docker images
        run: |
          docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/webgpu:latest
          docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/clusters-arrays-gpu:66
          docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/electric-and-magnetic-field-circuits:48

      - name: Build all MajoranaStarship files
        run: |
          cd WebGPU/Majoran-Starship
          dotnet build MajoranaStarshipCategoryTopos.qs
          dotnet build MajoranaStarshipCausalityHolography.qs
          dotnet build MajoranaStarshipCosmology.qs
          dotnet build MajoranaStarshipDiracYangMills.qs
          dotnet build MajoranaStarshipEinsteinMaxwell.qs
          dotnet build MajoranaStarshipHilbert.qs
          dotnet build MajoranaStarshipLoopGravity.qs
          dotnet build MajoranaStarshipMTheory.qs
          dotnet build MajoranaStarshipModalInfo.qs
          dotnet build MajoranaStarshipMultiverseQubits.qs
          dotnet build MajoranaStarshipPDE.qs
          dotnet build MajoranaStarshipQKD.qs
          dotnet build MajoranaStarshipQuantumBlackHole.qs
          dotnet build MajoranaStarshipQuantumBlackHoles.qs
          dotnet build MajoranaStarshipQuantumChaosDynamics.qs
          dotnet build MajoranaStarshipQuantumCosmicStrings.qs
          dotnet build MajoranaStarshipQuantumCreation.qs
          dotnet build MajoranaStarshipQuantumDestiny.qs
          dotnet build MajoranaStarshipQuantumEntanglementNetworks.qs
          dotnet build MajoranaStarshipQuantumEternity.qs
          dotnet build MajoranaStarshipQuantumExoplanets.qs
          dotnet build MajoranaStarshipQuantumFractals.qs
          dotnet build MajoranaStarshipQuantumFreedom.qs
          dotnet build MajoranaStarshipQuantumGalaxies.qs
          dotnet build MajoranaStarshipQuantumGeometry.qs
          dotnet build MajoranaStarshipQuantumGravityWaves.qs
          dotnet build MajoranaStarshipQuantumHyperdimensional.qs
          dotnet build MajoranaStarshipQuantumInfinity.qs
          dotnet build MajoranaStarshipQuantumMultiverse.qs
          dotnet build MajoranaStarshipQuantumNebulae.qs
          dotnet build MajoranaStarshipQuantumNeuralStarship.qs
          dotnet build MajoranaStarshipQuantumSingularity.qs
          dotnet build MajoranaStarshipQuantumSupernovae.qs
          dotnet build MajoranaStarshipQuantumSymmetryBreaking.qs
          dotnet build MajoranaStarshipQuantumTimeCrystal.qs
          dotnet build MajoranaStarshipQuantumTimeTravel.qs
          dotnet build MajoranaStarshipQuantumTopology.qs
          dotnet build MajoranaStarshipQuantumWormholes.qs
          dotnet build MajoranaStarshipStringTheory.qs
          dotnet build MajoranaStarshipTemporalDistributed.qs
          dotnet build MajoranaQuantumValidator.qs
          dotnet build MajoranaQuantumRegistryExplorer.qs
          dotnet build MajoranaQuantumBlockchain.qs
          dotnet build MajoranaQuantumAuditorQubotsStability.qs

      - name: Upload binaries artifacts
        uses: actions/upload-artifact@v4
        with:
          name: majorana-quibits-binaries
          path: 'WebGPU/Majoran-Starship/**/bin/**'

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release tag
        id: tag
        run: |
          VERSION="v$(date +'%Y.%m.%d.%H%M')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          git tag $VERSION
          git push origin $VERSION

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "Topo-Majorana-Quibits Release ${{ steps.tag.outputs.version }}"
          files: 'WebGPU/Majoran-Starship/**/bin/**'

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t topo-majorana-quibits:latest -f WebGPU/Majoran-Starship/Dockerfile WebGPU/Majoran-Starship

      - name: Push Docker image to GitHub Container Registry
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag topo-majorana-quibits:latest ghcr.io/${{ github.repository }}/topo-majorana-quibits:latest
          docker push ghcr.io/${{ github.repository }}/topo-majorana-quibits:latest
