name: Edge-AI-APP CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Elixir
        uses: actions/setup-elixir@v4
        with:
          elixir-version: '1.15'
          otp-version: '26.0'

      - name: Install deps
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run Tests
        run: mix test

      - name: Build Release
        run: mix release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-app
          path: _build/prod/rel/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Edge-AI-APP Release ${{ github.run_number }}"
          body: |
            ## 🚀 Automatic Release: Edge-AI-APP

            ✅ All tests passed successfully before release.

            This release contains OTP binaries for:
            - ISA Matrix
            - Graph Neural Networks
            - Quantum-inspired Circuits
            - Petri Nets
            - Tensor Cores / CUDA pipelines
            - Category Theory abstractions
            - Blockchain DAGs

            ### 📊 Classification Table

            | Module              | Function                                | Execution |
            |---------------------|-----------------------------------------|-----------|
            | ISA Matrix          | Instruction Set Architecture binding    | OTP Nodes |
            | Graph Neural Nets   | Graph data relationships                | OTP Tasks |
            | Quantum Circuits    | Quantum-inspired simulations            | OTP Tasks |
            | Petri Nets          | Concurrency & distributed verification  | OTP Tasks |
            | Tensor Cores/CUDA   | Parallel matrix ops                     | NIFs/OTP  |
            | Category Theory     | Mathematical abstractions & compositions| OTP Tasks |
            | Blockchain DAGs     | Distributed transaction/state graphs    | OTP Tasks |

            ### 🔗 Distributed Cluster Diagram

            ```
            +------------------+        +------------------+        +------------------+
            |   Node1 (ISA)    | <----> |   Node2 (GNN)    | <----> | Node3 (Blockchain)|
            | Executes ISA ops |        | Processes graphs |        | Validates DAGs    |
            +------------------+        +------------------+        +------------------+
                   ^                           ^                           ^
                   |                           |                           |
                   +----------- RPC Calls ------+----------- RPC Calls -----+
            ```

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
