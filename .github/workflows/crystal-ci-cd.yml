name: CI/CD Crystal Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Crystal
      - name: Setup Crystal
        run: |
          sudo apt-get update
          sudo apt-get install -y crystal

      # Compile Crystal file into binary
      - name: Build Crystal binary
        run: |
          mkdir -p dist
          crystal build src/EdgeAIManager.cr --release -o dist/EdgeAIManager

      # Run binary to validate output
      - name: Execute Crystal binary
        run: |
          ./dist/EdgeAIManager > dist/output.log

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-crystal
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: edge-ai-crystal
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Automated Crystal Release v${{ github.run_number }}"
          body: |
            Automated build and release of Edge-AI-APP Crystal module:
            - EdgeAIManager.cr compiled into binary
            - Executed successfully, logs included
          files: release/**
