name: Azure Artifacts Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-binary-matrix:
    name: Build Binary — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y nasm yasm binutils

      - name: Install Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install nasm || brew upgrade nasm || true

      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install nasm --no-progress -y
        shell: pwsh

      - name: Compile source
        shell: bash
        run: |
          mkdir -p build/logs build/bin build/obj
          make build || echo "Make build failed, but continuing for debugging"
          
          echo "Listing generated binaries (build/bin):"
          ls -R build/bin 2>/dev/null || echo "No files in build/bin"

      - name: Package artifacts (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p release_dist
          cp -r build/bin/* release_dist/ 2>/dev/null || true
          tar -czf release_${{ matrix.os }}_${{ github.sha }}.tar.gz -C release_dist .
          echo "Pacote de release criado para ${{ matrix.os }}."

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_dist | Out-Null
          if (Test-Path "build\bin") {
            Copy-Item -Path "build\bin\*" -Destination "release_dist\" -Recurse -Force
          }
          Compress-Archive -Path "release_dist\*" -DestinationPath "release_${{ matrix.os }}_${{ github.sha }}.zip"
          echo "Pacote de release criado para ${{ matrix.os }}."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-release-${{ matrix.os }}
          path: |
            release_${{ matrix.os }}_${{ github.sha }}.tar.gz
            release_${{ matrix.os }}_${{ github.sha }}.zip

  deploy:
    name: Deploy to Azure Artifacts
    needs: build-binary-matrix
    runs-on: ubuntu-latest
    environment: Azure Artifacts
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Flatten artifact files
        run: |
          mkdir -p deploy_dist
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp -t ./deploy_dist {} +
          echo "Contents of deploy_dist:"
          ls -lh ./deploy_dist

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Add Azure DevOps extension
        run: az extension add --name azure-devops

      - name: Login and Publish to Azure Artifacts
        shell: bash
        env:
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
          AZURE_DEVOPS_CLI_NO_UNIVERSAL_TOOL_UPDATE: true # Prevent Universal Packages tooling update
        run: |
          if [ -z "${AZURE_DEVOPS_EXT_PAT}" ]; then
            echo "Error: AZURE_DEVOPS_EXT_PAT is not set. Please configure it in your repository secrets."
            exit 1
          fi

          echo "${AZURE_DEVOPS_EXT_PAT}" | az devops login

          ORG_URL="https://dev.azure.com/alexandrepedrosaai"
          FEED_NAME="EdgeAIApp"

          echo "Publishing artifacts to Azure Artifacts..."
          for file in ./deploy_dist/*; do
            filename=$(basename "$file")
            echo "Attempting to publish $filename..."
            az artifacts universal publish \
              --organization "$ORG_URL" \
              --feed "$FEED_NAME" \
              --name "edge-ai-app-binary" \
              --version "1.0.${{ github.run_number }}" \
              --description "Automated deployment from GitHub Actions" \
              --path "$file"
          done
