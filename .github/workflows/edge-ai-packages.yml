
name: Edge AI Packages Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Prefixo para as imagens no GitHub Container Registry
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/edge-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        artifact:
          - name: "chip-developer-kit"
            file: "Chip-Developer-Kit.asm.hex"
          - name: "cnn"
            file: "Convolutional-Neural-Network-CNN.hex"
          - name: "developer-manual"
            file: "Developer-Manual-for-AI-Silicon-Chips.asm.hex"
          - name: "metamorphosis"
            file: "Metamorphosis-and-retro-metamorphosis-to-silicon-hardware.asm.hex"
          - name: "mlp"
            file: "Multilayer-Perceptron-MLP.asm.hex"
          - name: "neural-forward-pass"
            file: "Neural-Forward-Pass-Unified.asm.asm.hex"
          - name: "app"
            file: "App.hex"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ matrix.artifact.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.edge-ai
          push: true
          build-args: |
            HEX_FILE=${{ matrix.artifact.file }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
