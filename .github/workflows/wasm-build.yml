name: Build and Deploy WebAssembly

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install wabt (WebAssembly Binary Toolkit)
      run: |
        sudo apt-get update
        sudo apt-get install -y wabt

    - name: Compile .wat to .wasm
      run: |
        mkdir -p docs
        cd WEBASSEMBLY
        for file in *.wat; do
          echo "Compiling $file..."
          wat2wasm "$file" -o "../docs/${file%.wat}.wasm"
        done

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        # Upload entire docs directory
        path: './docs'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # Additional job to create a GitHub Release with the build artifacts
  release-deploy:
    needs: build-wasm
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download compiled WASM from previous job
        # This downloads the artifact uploaded by upload-pages-artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./release-docs

      - name: Extract artifacts
        run: |
          # The github-pages artifact is a tar file, we extract it to get the .wasm files
          mkdir -p ./dist
          tar -xvf ./release-docs/artifact.tar -C ./dist
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wasm-v${{ github.run_number }}
          name: WebAssembly Build v${{ github.run_number }}
          files: ./dist/*
          body: |
            🚀 **Automated WebAssembly Build & Deployment**
            
            ✅ WebAssembly modules compiled and deployed to GitHub Pages.
            🔗 **Live App:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
