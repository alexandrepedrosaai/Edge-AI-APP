name: Assembly Build Pipeline

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - '.ASM_HEX/**'
      - 'build-assembly.sh'
      - 'containers/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assembly-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Assembly tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm binutils gcc g++ build-essential

      - name: Verify tools
        run: |
          echo "=== NASM ===" && nasm --version
          echo "=== YASM ===" && yasm --version
          echo "=== GCC ===" && gcc --version

      - name: Make build script executable
        run: chmod +x build-assembly.sh

      - name: Run Assembly build pipeline
        run: ./build-assembly.sh x86_64 linux

      - name: Display build report
        if: always()
        run: |
          if [ -f build/logs/build-report.txt ]; then
            echo "=== Build Report ==="
            cat build/logs/build-report.txt
          fi

      - name: List build artifacts
        if: always()
        run: |
          echo "=== Build Artifacts ==="
          find build -type f 2>/dev/null | head -30 || echo "No build directory"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assembly-build-artifacts
          path: build/
          retention-days: 30

      - name: Create summary
        if: always()
        run: |
          echo "# Assembly Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f build/logs/build-report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build/logs/build-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  docker-validate:
    runs-on: ubuntu-latest
    needs: assembly-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose config --quiet && echo "docker-compose.yml is valid"

      - name: List container Dockerfiles
        run: |
          echo "=== Container Dockerfiles ==="
          find containers -name Dockerfile | sort | while read f; do
            echo ""
            echo "--- $f ---"
            head -5 "$f"
          done
