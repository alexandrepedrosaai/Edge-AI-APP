name: CI/CD BASIC Pipeline
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install FreeBASIC
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip libncurses6 libtinfo6 xz-utils || true
        wget -O FreeBASIC-1.10.0-linux-x86_64.tar.xz "https://downloads.sourceforge.net/project/fbc/FreeBASIC-1.10.0/Binaries-Linux/FreeBASIC-1.10.0-linux-x86_64.tar.xz"
        tar -xJf FreeBASIC-1.10.0-linux-x86_64.tar.xz
        cd FreeBASIC-1.10.0-linux-x86_64
        sudo ./install.sh -i /usr/local
        cd ..

    - name: Build BASIC Artifact
      run: fbc src/basic/hello.bas -ohello_basic

    - name: Upload BASIC Artifact
      uses: actions/upload-artifact@v4
      with:
        name: basic-artifact
        path: hello_basic

    - name: Create Automated Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        files: hello_basic
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
