name: SIMULADOR QUÂNTICO MIPS - CI/CD COMPLETO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-e-processar:
    name: Compilar, Gerar Binários e Visualizações
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt update -y
          sudo apt install -y python3 python3-pip zip unzip
          pip3 install numpy matplotlib qutip
        shell: bash

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Baixar MARS Simulator
        run: |
          wget -q --no-check-certificate https://courses.missouristate.edu/KenVollmar/MARS/MARS_4_5_Aug2014/Mars4_5.jar -O mars.jar
          chmod +x mars.jar

      - name: Gerar binários MIPS
        run: |
          mkdir -p build_binaries
          # Compilar o arquivo principal de circuitos quânticos
          java -jar mars.jar a dump .text HexText build_binaries/QUANTUM-INSPER-CIRCUITS.hex GATES/QUANTUM-INSPER-CIRCUITS.mips
          # Gerar um dump binário simulado para o release
          echo "MIPS Binary Dump for Quantum Circuits" > build_binaries/QUANTUM-INSPER-CIRCUITS.bin
          cat GATES/QUANTUM-INSPER-CIRCUITS.mips >> build_binaries/QUANTUM-INSPER-CIRCUITS.bin
          
          # Ampliação Matemática 7x (Simulada via logs de build)
          echo "Nível 1: Inicialização de Qubits MIPS" > build_binaries/math_expansion.log
          echo "Nível 2: Aplicação de Portas Hadamard (H)" >> build_binaries/math_expansion.log
          echo "Nível 3: Entrelaçamento Quântico (CNOT)" >> build_binaries/math_expansion.log
          echo "Nível 4: Evolução Temporal Ψ(t) = exp(-iHt/ħ)Ψ(0)" >> build_binaries/math_expansion.log
          echo "Nível 5: Colapso da Função de Onda via Registradores MIPS" >> build_binaries/math_expansion.log
          echo "Nível 6: Cálculo de Probabilidades |α|^2 + |β|^2 = 1" >> build_binaries/math_expansion.log
          echo "Nível 7: Sincronização Multidimensional MetaverseOS" >> build_binaries/math_expansion.log

      - name: Simulação Quântica Python
        run: |
          python3 - <<'EOF'
          import numpy as np
          import matplotlib.pyplot as plt
          
          # Simulação de Probabilidade Quântica MIPS
          t = np.linspace(0, 10, 100)
          prob = np.abs(np.sin(t) * np.exp(-0.1*t))**2
          
          plt.figure(figsize=(10,6))
          plt.plot(t, prob, label='Probabilidade de Estado |1>', color='cyan', linewidth=2)
          plt.fill_between(t, prob, color='cyan', alpha=0.2)
          plt.title("Simulação de Circuito Quântico MIPS - Evolução Temporal", color='white')
          plt.xlabel("Tempo (ns)")
          plt.ylabel("Probabilidade")
          plt.grid(True, alpha=0.3)
          plt.legend()
          plt.gcf().set_facecolor('#121212')
          plt.gca().set_facecolor('#121212')
          plt.gca().tick_params(colors='white')
          plt.savefig("build_binaries/quantum_mips_simulation.png")
          EOF

      - name: Upload Artefatos Binários
        uses: actions/upload-artifact@v3
        with:
          name: mips-quantum-binaries
          path: build_binaries/

  release:
    runs-on: ubuntu-latest
    needs: [build-e-processar]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Baixa Artefatos
        uses: actions/download-artifact@v3
        with:
          name: mips-quantum-binaries
          path: release_assets/

      - name: Automated Quantum Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v-mips-${{ github.sha }}
          name: "Quantum MIPS Release ${{ github.sha }}"
          files: |
            release_assets/QUANTUM-INSPER-CIRCUITS.hex
            release_assets/QUANTUM-INSPER-CIRCUITS.bin
            release_assets/math_expansion.log
            release_assets/quantum_mips_simulation.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker GitHub Package Publish
        run: |
          echo "FROM ubuntu:latest" > Dockerfile
          echo "COPY release_assets/ /opt/quantum/mips/" >> Dockerfile
          echo "CMD [\"ls\", \"-R\", \"/opt/quantum/mips/\"]" >> Dockerfile
          
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/quantum-mips-sim
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          
          docker build -t $IMAGE_ID:latest .
          docker push $IMAGE_ID:latest
