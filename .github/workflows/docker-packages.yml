name: Build & Push Docker Packages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: alexandrepedrosaai

jobs:

  # ============================================================
  # 1. edge-asm-hex-linux
  # ============================================================
  edge-asm-hex-linux:
    name: Package — edge-asm-hex-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/edge-asm-hex-linux/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/edge-asm-hex-linux:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/edge-asm-hex-linux:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            sha256.artifact=15206001eacc685c24c8cd3c448d23822a90f833a0dc57176a4bfdcb86319ad0

  # ============================================================
  # 2. edge-asm-hex-macos
  # ============================================================
  edge-asm-hex-macos:
    name: Package — edge-asm-hex-macos
