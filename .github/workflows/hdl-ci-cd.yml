name: HDL CI | CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-hdl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install HDL tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ghdl iverilog

      - name: Create output directory
        run: mkdir -p fpga_build

      - name: Compile VHDL (analyse + elaborate)
        run: |
          ghdl -a --std=08 src/vhdl/top_entity.vhd
          ghdl -a --std=08 tests/tb_top.vhd
          ghdl -e --std=08 tb_top

      - name: Run VHDL simulation (generate waveform)
        run: |
          ghdl -r --std=08 tb_top \
            --wave=fpga_build/wave.ghw \
            --vcd=fpga_build/wave.vcd \
            --stop-time=500ns 2>&1 | tee fpga_build/vhdl_sim.log || true

      - name: Compile Verilog design + testbench
        run: |
          iverilog -o fpga_build/verilog_sim \
            src/verilog/top_entity.v \
            tests/tb_top.v

      - name: Run Verilog simulation (generate VCD)
        run: |
          cd fpga_build && ./verilog_sim 2>&1 | tee verilog_sim.log || true

      - name: Upload HDL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hdl-artifacts
          path: |
            fpga_build/wave.ghw
            fpga_build/wave.vcd
            fpga_build/tb_top.vcd
            fpga_build/vhdl_sim.log
            fpga_build/verilog_sim.log

  release:
    runs-on: ubuntu-latest
    needs: build-hdl
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download HDL artifacts
        uses: actions/download-artifact@v4
        with:
          name: hdl-artifacts
          path: release-files/

      - name: List release files
        run: find release-files/ -type f | sort

      - name: Package all artifacts
        run: |
          zip -r release-files/hdl-artifacts.zip release-files/ -x "*.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: hdl-latest
          name: "HDL Build — Latest"
          body: |
            Automated HDL simulation build.

            **Commit:** ${{ github.sha }}

            ## Artifacts
            | File | Description |
            |------|-------------|
            | `wave.ghw` | GHDL waveform (open with GTKWave) |
            | `wave.vcd` | VHDL VCD waveform |
            | `tb_top.vcd` | Verilog VCD waveform |
            | `hdl-artifacts.zip` | All simulation outputs bundled |
          files: |
            release-files/wave.ghw
            release-files/wave.vcd
            release-files/tb_top.vcd
            release-files/hdl-artifacts.zip
          prerelease: false
