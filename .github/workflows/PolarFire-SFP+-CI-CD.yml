name: PolarFire SFP+ CI/CD 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        language: [c, vhdl, verilog, python]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Toolchain
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential cmake ghdl verilator python3 python3-pip
            pip3 install -r requirements.txt || true
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            choco install cmake -y
            choco install python -y
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            brew install cmake ghdl verilator python3
          fi

      - name: Build ${{ matrix.language }} Artifacts
        run: |
          mkdir -p build/${{ matrix.os }}/${{ matrix.language }}
          cd build/${{ matrix.os }}/${{ matrix.language }}
          if [ "${{ matrix.language }}" == "c" ]; then
            cmake ../..
            make -j$(nproc)
          elif [ "${{ matrix.language }}" == "vhdl" ]; then
            ghdl -a ../../src/*.vhdl
            ghdl -e top_module
          elif [ "${{ matrix.language }}" == "verilog" ]; then
            verilator --cc ../../src/*.v --exe testbench.cpp
          elif [ "${{ matrix.language }}" == "python" ]; then
            python3 ../../scripts/build.py
          fi

      - name: Upload ${{ matrix.os }}-${{ matrix.language }} Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: polarfire-sfp-${{ matrix.os }}-${{ matrix.language }}
          path: build/${{ matrix.os }}/${{ matrix.language }}/*

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build Docker image with Microchip name and version tags
      - name: Build Docker Image
        run: |
          VERSION="v${{ github.run_number }}"
          docker build -t microchip/polarfire-sfp:latest -t microchip/polarfire-sfp:${VERSION} .

      # Login to Docker Hub (requires secrets.DOCKER_USERNAME and secrets.DOCKER_PASSWORD)
      - name: Docker Hub Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Push Docker image to Docker Hub
      - name: Push Docker Image
        run: |
          VERSION="v${{ github.run_number }}"
          docker push microchip/polarfire-sfp:latest
          docker push microchip/polarfire-sfp:${VERSION}

  release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "PolarFire FPGA SFP+ Module Release"
          body: |
            ## PolarFire FPGA SFP+ Module (AN4364)
            This release contains binaries, simulation files, and Docker images packaged under the Microchip name:
            - FPGA Bitstream (MPF200T-FCSG325)
            - Transceiver configuration (12.7G)
            - IBIS-AMI simulation files
            - Optical compliance data (10GBASE-SR)
            - ROSA/TOSA drivers
            - PCB layout (Nelco 4000-13SI)
            - **Docker Images:**
              - microchip/polarfire-sfp:latest
              - microchip/polarfire-sfp:v${{ github.run_number}}

            **Multi-platform support:**
            - Linux (Ubuntu)
            - Windows
            - macOS

            **Multi-language support:**
            - C
            - VHDL
            - Verilog
            - Python

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: build/**/*
