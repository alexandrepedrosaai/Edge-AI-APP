name: PolarFire SFP+ CI/CD 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        language: [c, vhdl, verilog, python]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Toolchain
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential cmake ghdl verilator python3 python3-pip
            pip3 install -r requirements.txt || true
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            choco install cmake -y
            choco install python -y
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            brew install cmake ghdl verilator python3
          fi

      - name: Build ${{ matrix.language }} Artifacts
        shell: bash
        run: |
          mkdir -p build/${{ matrix.os }}/${{ matrix.language }}
          cd build/${{ matrix.os }}/${{ matrix.language }}
          if [ "${{ matrix.language }}" == "c" ]; then
            cmake ../.. || true
            make -j$(nproc) || true
          elif [ "${{ matrix.language }}" == "vhdl" ]; then
            ghdl -a ../../src/vhdl/*.vhd || true
            ghdl -e top_module || true
          elif [ "${{ matrix.language }}" == "verilog" ]; then
            verilator --cc ../../src/verilog/top_entity.v --exe ../../verilog/verilator.cpp --top-module top_entity || true
            if [ -f obj_dir/Vtop_entity.mk ]; then
              make -C obj_dir -f Vtop_entity.mk Vtop_entity || true
            fi
          elif [ "${{ matrix.language }}" == "python" ]; then
            python3 ../../scripts/build.py || true
          fi

      - name: Upload ${{ matrix.os }}-${{ matrix.language }} Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: polarfire-sfp-${{ matrix.os }}-${{ matrix.language }}
          path: build/${{ matrix.os }}/${{ matrix.language }}/*

  docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}/microchip/polarfire-sfp"
          VERSION="v${{ github.run_number }}"
          
          docker build -t ${IMAGE_NAME}:latest -t ${IMAGE_NAME}:${VERSION} .
          docker push ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${VERSION}

  release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and Push Tag
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Se a tag já existir, remove localmente e no servidor para evitar erro 128
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME já existe. Atualizando..."
            git tag -d "$TAG_NAME"
            git push --delete origin "$TAG_NAME" || true
          fi
          
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "PolarFire FPGA SFP+ Module Release ${{ env.TAG_NAME }}"
          body: |
            ## PolarFire FPGA SFP+ Module (AN4364)
            This release contains binaries, simulation files, and Docker images packaged under the Microchip name:
            - FPGA Bitstream (MPF200T-FCSG325)
            - Transceiver configuration (12.7G)
            - IBIS-AMI simulation files
            - Optical compliance data (10GBASE-SR)
            - ROSA/TOSA drivers
            - PCB layout (Nelco 4000-13SI)
            - **Docker Images (GitHub Packages):**
              - ghcr.io/${{ github.repository_owner }}/microchip/polarfire-sfp:latest
              - ghcr.io/${{ github.repository_owner }}/microchip/polarfire-sfp:${{ env.TAG_NAME }}

            **Multi-platform support:**
            - Linux (Ubuntu)
            - Windows
            - macOS

            **Multi-language support:**
            - C
            - VHDL
            - Verilog
            - Python
          files: build/**/*
          generate_release_notes: true
          
