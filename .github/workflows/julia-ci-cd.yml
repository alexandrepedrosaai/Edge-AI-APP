name: EdgeAi Julia CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Julia
      uses: julia-actions/setup-julia@v2
      with:
        version: '1.10'

    - name: Add General Registry and Install dependencies
      run: |
        julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.add("PackageCompiler")'
        julia --project=JULIA -e 'using Pkg; Pkg.resolve(); Pkg.instantiate()'
  
    - name: Run tests 
      run: |
        mkdir -p JULIA/test
        echo 'using Test; @testset "Basic Tests" begin @test 1 == 1 end' > JULIA/test/runtests.jl
        julia --project=JULIA -e 'using Pkg; Pkg.test()'
  
    - name: Compile binary
      run: |
        mkdir -p build
        julia --project=JULIA -e '
          using PackageCompiler;
          create_app("JULIA", "build/EdgeAiJuliaApp", force=true, incremental=false, filter_stdlibs=false)
        '
    
    - name: Verify build output
      run: |
        echo "Checking build directory..."
        ls -R build/
        if [ ! -d "build/EdgeAiJuliaApp" ] || [ -z "$(ls -A build/EdgeAiJuliaApp)" ]; then
          echo "❌ Error: Build output directory is empty or does not exist!"
          exit 1
        fi
        # Check if there are any files with size > 0
        if [ $(find build/EdgeAiJuliaApp -type f -size +0c | wc -l) -eq 0 ]; then
          echo "❌ Error: No non-empty files found in build directory!"
          exit 1
        fi
        echo "✅ Build output verified."

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: edge-ai-julia-app
        path: build/EdgeAiJuliaApp/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: edge-ai-julia-app
        path: ./release

    - name: Check release assets
      run: |
        echo "Listing downloaded assets:"
        ls -R ./release
        if [ -z "$(ls -A ./release)" ]; then
          echo "❌ Error: Release directory is empty!"
          exit 1
        fi
        # Remove any empty files or directories that might cause issues with GitHub Release
        find ./release -type f -size 0 -delete
        find ./release -type d -empty -delete
        echo "✅ Release assets verified."

    - name: Create automated release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: julia-v${{ github.run_number }}
        name: "EdgeAiJulia Release ${{ github.run_number }}"
        body: |
          🚀 Automated release generated by Julia CI/CD pipeline
          - Binary artifact included
        files: |
          ./release/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
