name: EdgeAi Julia CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Julia
      uses: julia-actions/setup-julia@v1
      with:
        version: '1.10'

    - name: Install dependencies
      run: |
        # Resolve e instala as dependências corretamente
        julia --project=JULIA -e 'using Pkg; Pkg.resolve(); Pkg.instantiate()'

    - name: Run tests
      run: |
        # Cria estrutura de teste se não existir
        mkdir -p JULIA/test
        echo 'using Test; @testset "Basic Tests" begin @test 1 == 1 end' > JULIA/test/runtests.jl
        julia --project=JULIA -e 'using Pkg; Pkg.test()'

    - name: Compile binary
      run: |
        # Adiciona PackageCompiler e compila o app
        julia --project=JULIA -e 'using Pkg; Pkg.add("PackageCompiler")'
        mkdir -p build
        julia --project=JULIA -e 'using PackageCompiler; create_app("JULIA", "build/EdgeAiJuliaApp", force=true)'

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: edge-ai-julia-app
        path: build/EdgeAiJuliaApp

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: edge-ai-julia-app
        path: ./release

    - name: Create automated release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: julia-v${{ github.run_number }}
        name: "EdgeAiJulia Release ${{ github.run_number }}"
        body: |
          🚀 Automated release generated by Julia CI/CD pipeline
          - Binary artifact included
        files: ./release/**
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
