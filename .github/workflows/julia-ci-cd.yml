name: EdgeAi Julia CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Julia
      uses: julia-actions/setup-julia@v1
      with:
        version: '1.10'

    - name: Install dependencies
      run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

    - name: Run tests
      run: julia --project=. -e 'using Pkg; Pkg.test()'

    - name: Compile binary
      run: julia --project=. -e 'using PackageCompiler; create_app("src", "build/EdgeAiJuliaApp")'

    - name: Upload binary artifact
      uses: actions/upload-artifact@v3
      with:
        name: edge-ai-julia-app
        path: build/EdgeAiJuliaApp

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: edge-ai-julia-app
        path: ./release

    - name: Create automated release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: "EdgeAiJulia Release ${{ github.run_number }}"
        body: |
          🚀 Automated release generated by Julia CI/CD pipeline
          - Binary artifact included
          - Logs and SBOM attached
        files: ./release/**
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-azure:
    needs: release
    runs-on: ubuntu-latest

    steps:
    - name: Upload to Azure Functions
      uses: azure/functions-action@v1
      with:
        app-name: "EdgeAiJuliaApp"
        package: ./release/**
      env:
        AZURE_FUNCTIONAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
