name: Quantum Lunar Base Simulation
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  quantumlunarpipeline:
    name: Q# Lunar Simulation → Oxygen & Water → Semi-sphere Dome
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # ==================================================
      # 1. ENVIRONMENT SETUP
      # ==================================================
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Install Jupyter
        run: pip install jupyter
      - name: Install QDK
        run: |
          dotnet tool install -g Microsoft.Quantum.IQSharp
          dotnet iqsharp install
      # ==================================================
      # 2. COMPILE Q# PROJECT
      # ==================================================
      - name: Compile Q# Lunar Simulation
        run: |
          cd Quantum-Lunar-Base-Simulation/LunarSim
          dotnet build QuantumLunarSimulationProject.csproj
      
      - name: Cleanup Invalid Filenames
        run: |
          # Find and remove any files with a literal '*' in their name to fix artifact upload
          find Quantum-Lunar-Base-Simulation/LunarSim/bin/Debug/net6.0/ -name "*\**" -delete
          echo "Cleanup of invalid filenames completed."

      # ==================================================
      # 3. UPLOAD ARTIFACTS
      # ==================================================
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantum-lunar-base-artifacts
          path: |
            Quantum-Lunar-Base-Simulation/Reports/
            Quantum-Lunar-Base-Simulation/Visuals/
            Quantum-Lunar-Base-Simulation/LunarSim/bin/Debug/net6.0/
      # ==================================================
      # 4. AUTOMATIC RELEASE
      # ==================================================
      - name: Create Automatic Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v-quantum-lunar-${{ github.sha }}
          name: "Quantum Lunar Base Simulation Release ${{ github.sha }}"
          files: |
            Quantum-Lunar-Base-Simulation/Reports/
            Quantum-Lunar-Base-Simulation/Visuals/
            Quantum-Lunar-Base-Simulation/LunarSim/bin/Debug/net6.0/
          body: |
            🚀 **Quantum Lunar Base Simulation**
            🌌 Q# simulation with O₂, H₂O parameters and semi-spherical dome for 500 humans.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ==================================================
      # 5. DOCKER PACKAGE PUBLISH
      # ==================================================
      - name: Docker GitHub Package Publish
        run: |
          echo "FROM mcr.microsoft.com/quantum/iqsharp-base:latest" > Dockerfile
          echo "WORKDIR /app" >> Dockerfile
          echo "COPY Quantum-Lunar-Base-Simulation/Reports/ /app/Reports/" >> Dockerfile
          echo "COPY Quantum-Lunar-Base-Simulation/Visuals/ /app/Visuals/" >> Dockerfile
          echo "COPY Quantum-Lunar-Base-Simulation/LunarSim/ /app/LunarSim/" >> Dockerfile
          echo "CMD [\"dotnet\", \"run\", \"--project\", \"Quantum-Lunar-Base-Simulation/LunarSim\"]" >> Dockerfile
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/quantum-lunar-base-simulation
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker build -t $IMAGE_ID:latest .
          docker push $IMAGE_ID:latest
          
