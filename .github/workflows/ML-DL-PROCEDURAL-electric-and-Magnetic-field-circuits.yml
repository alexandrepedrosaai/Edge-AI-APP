name: ML DL PROCEDURAL electric and Magnetic field circuits

on:
  push:
    branches:
      - main

concurrency:
  group: ml-dl-procedural-release-main
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ⚡ Step 1: Electric Laws
      - name: Apply Electric Laws
        run: |
          echo "Applying Ohm's Law (V=IR)..."
          echo "Applying Kirchhoff's Laws..."
          echo "Applying Maxwell's Equations..."
          echo "Electric laws validated."

      # ⚡ Step 2: Power Calculation
      - name: Calculate Electrical Power
        run: |
          V=12; I=2
          P=$((V * I))
          echo "Power Calculation: P = V * I = $P W"

      # ⚡ Step 3: Magnetic Flux Calculation
      - name: Calculate Magnetic Flux
        run: |
          B=0.5; A=0.1
          Phi=$(echo "$B * $A" | bc -l)
          echo "Magnetic Flux: Φ = B * A = $Phi Wb"

      # ⚡ Step 4: EMF Induced Calculation
      - name: Calculate Induced EMF
        run: |
          dPhi=0.05; dt=0.01
          EMF=$(echo "-($dPhi / $dt)" | bc -l)
          echo "Induced EMF: ε = -dΦ/dt = $EMF V"

      # ⚡ Step 5: Electromagnetic Circuit (Lenz Key)
      - name: Apply Lens Key Circuit
        run: |
          echo "Applying Lenz's Law..."
          echo "Induced EMF opposes flux change..."
          echo "Flux conservation validated."

      # ⚡ Step 6: Pull WebGPU base image
      - name: Pull WebGPU base image
        run: docker pull ghcr.io/alexandrepedrosaai/edge-ai-app/webgpu:latest

      # Step 7: Build All
      - name: Build All
        run: |
          mkdir -p build/bin
          cp WebGPU/* build/bin/
          echo "Build All completed: all source files copied."

      # Step 8: Install WASM Tools
      - name: Install WebAssembly tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
          curl -L https://github.com/WebAssembly/binaryen/releases/latest/download/binaryen-version_122-x86_64-linux.tar.gz -o binaryen.tar.gz
          tar -xzf binaryen.tar.gz
          sudo cp binaryen-*/bin/wasm-opt /usr/local/bin/

      # Step 9: Convert to WASM (Modified to handle only WASM if exists)
      - name: Prepare WASM directory
        run: |
          mkdir -p build/wasm
          # If you have actual WASM files or want to copy JS files as placeholders:
          cp -r build/bin/* build/wasm/ || true

      # Step 10: Validate WASM
      - name: Validate WASM binaries
        run: |
          shopt -s nullglob
          for w in build/wasm/*.wasm; do
            wasm-validate "$w" || echo "Validation failed for $w"
          done

      # Step 11: Optimize WASM
      - name: Optimize WASM binaries
        run: |
          shopt -s nullglob
          for w in build/wasm/*.wasm; do
            wasm-opt -O3 "$w" -o "$w"
          done

      # Step 12: Simulate Neural Circuits
      - name: Simulate Neural Circuits
        run: |
          echo "Simulating LLM, ML, DL, Procedural circuits..."
          node build/bin/arraysGPU.js --simulate-circuits
          node build/bin/dashboard.js --trace-circuits
          node build/bin/websocket.js --sync-circuits

      # Step 13: Deploy artifacts via github-actions[bot]
      - name: Deploy artifacts into folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Copy artifacts but EXCLUDE index.html from docs
            cp -r build/wasm/* WebGPU/
            cp -r build/wasm/* WEBASSEMBLY/
            
            # Copy to docs but EXCLUDE index.html to preserve the existing one
            find build/wasm/ -maxdepth 1 -type f ! -name 'index.html' -exec cp {} docs/ \;

            git add WebGPU docs WEBASSEMBLY

            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "chore(ci): deploy WASM + WebGPU assets (excluding index.html from docs)" && \
            git push origin HEAD:main && exit 0

            git reset --hard HEAD~1 || true
            sleep 2
          done

          echo "Failed to push after retries"
          exit 1

  release:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Step 14: Automatic Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Automated Release ${{ github.run_number }}"
          files: WebGPU/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Step 15: Build Docker image
      - name: Build Docker image
        run: docker build -t ghcr.io/alexandrepedrosaai/edge-ai-app/electric-and-magnetic-field-circuits:${{ github.run_number }} .

      # Step 16: Push Docker image
      - name: Push Docker image
        run: docker push ghcr.io/alexandrepedrosaai/edge-ai-app/electric-and-magnetic-field-circuits:${{ github.run_number }}
