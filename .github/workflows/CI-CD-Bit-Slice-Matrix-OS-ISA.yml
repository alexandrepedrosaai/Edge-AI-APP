name: CI-CD Bit-Slice Matrix OS-ISA Automated Releases

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-bitslice:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        isa: [x86, arm, riscv]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment (Linux/macOS)
        if: runner.os != 'Windows'
        run: sudo apt-get update && sudo apt-get install -y build-essential || true

      - name: Setup build environment (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y

      - name: Compile Bit-Slice Microcode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bitslice/${{ matrix.isa }}

          # Collect sources using NUL-delimited find (bash 3.2+ safe, space-safe)
          SRCS=()
          while IFS= read -r -d '' f; do
            SRCS+=("$f")
          done < <(find src -type f -name '*.c' -path '*/bitslice/*' -print0)

          if [ "${#SRCS[@]}" -eq 0 ]; then
            echo "No bit-slice sources found. Expected something like src/bitslice/*.c"
            exit 1
          fi

          gcc -O2 -o "build/bitslice/${{ matrix.isa }}/bitslice-${{ matrix.isa }}.bin" "${SRCS[@]}"

      - name: Validate Bit-Slice ISA Simulation
        run: |
          ./tools/isa-simulator --arch ${{ matrix.isa }} --input build/bitslice/${{ matrix.isa }}/bitslice-${{ matrix.isa }}.bin --validate

      - name: Generate SHA256 Hash
        run: |
          sha256sum build/bitslice/${{ matrix.isa }}/bitslice-${{ matrix.isa }}.bin > build/bitslice/${{ matrix.isa }}/bitslice-${{ matrix.isa }}.sha256

      - name: Upload Bit-Slice Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitslice-${{ matrix.os }}-${{ matrix.isa }}
          path: |
            build/bitslice/${{ matrix.isa }}/bitslice-${{ matrix.isa }}.bin
            build/bitslice/${{ matrix.isa }}/bitslice-${{ matrix.isa }}.sha256

  release:
    needs: build-bitslice
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Manifest JSON
        run: |
          echo "[" > manifest.json
          for f in $(find ./artifacts -name '*.bin'); do
            HASH=$(sha256sum "$f" | cut -d ' ' -f1)
            SIZE=$(stat -c%s "$f")
            OSISA=$(basename $(dirname "$f"))
            echo "  {\"file\":\"$(basename $f)\",\"osisa\":\"$OSISA\",\"size\":$SIZE,\"sha256\":\"$HASH\"}," >> manifest.json
          done
          sed -i '$ s/,$//' manifest.json
          echo "]" >> manifest.json

      - name: Create Tag for Release
        id: tag
        run: |
          set -euo pipefail
          TAG="v$(date +'%Y.%m.%d')-run${{ github.run_id }}"
          echo "Creating tag $TAG"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists locally."
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists on origin."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}
          name: "Matrix OS-ISA Bit-Slice Release ${{ steps.tag.outputs.tag }}"
          body: |
            Automated multi-OS / multi-ISA bit-slice release.
            Includes SHA256 hashes and manifest.json for integrity verification.
            Commit: ${{ github.sha }}
          artifacts: "./artifacts/**/*,manifest.json"
          allowUpdates: true
          replacesArtifacts: true
