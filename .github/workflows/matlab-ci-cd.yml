name: CI/CD Matlab Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_FILE: /home/runner/.matlab/R2024a_licenses/license.lic
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a
          products: |
            Deep_Learning_Toolbox
            Computer_Vision_Toolbox
            Optimization_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            MATLAB_Coder
            Deep_Learning_HDL_Toolbox

      - name: Set up MATLAB license
        run: |
          mkdir -p /home/runner/.matlab/R2024a_licenses
          echo "${{ secrets.MATLAB_LICENSE_FILE }}" > /home/runner/.matlab/R2024a_licenses/license.lic
          chmod 644 /home/runner/.matlab/R2024a_licenses/license.lic

      - name: Debug License File (Safe)
        run: |
          echo "Checking license file structure..."
          if [ -s /home/runner/.matlab/R2024a_licenses/license.lic ]; then
            echo "License file exists and is not empty."
          else
            echo "ERROR: License file is empty or missing!"
          fi

      - name: Prepare sample dataset
        run: |
          mkdir -p dataset/classA
          mkdir -p dataset/classB
          pip install Pillow
          python -c "from PIL import Image; Image.new('RGB', (64, 64), color='red').save('dataset/classA/sample1.jpg'); Image.new('RGB', (64, 64), color='blue').save('dataset/classB/sample2.jpg')"

      - name: Run Matlab tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: MATLAB/serc
          select-by-folder: true

      - name: Build Matlab artifacts
        uses: matlab-actions/run-command@v2
        with:
          command: |
            mkdir -p dist;
            addpath('MATLAB/serc');
            % Tenta instalar o conversor ONNX
            try
                matlab.addons.supportpackage.installSupportPackage('Deep Learning Toolbox Converter for ONNX Model Format');
            catch
                fprintf('Aviso: Suporte ONNX não pôde ser instalado.\n');
            end
            
            % Executa os scripts de build na ordem correta
            buildFundamentals;
            buildCNN;
            buildLSTM;
            buildIntegration;
            
            % Salva o workspace final
            save('dist/edge_ai_models.mat');

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-matlab
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: edge-ai-matlab
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Automated Matlab Release v${{ github.run_number }}"
          body: |
            Build e release automatizado dos módulos de Deep Learning para Edge-AI-APP.
          files: release/**
