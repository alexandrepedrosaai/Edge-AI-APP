name: CI/CD Matlab Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_FILE: /home/runner/.matlab/R2024a_licenses/license.lic
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a

      - name: Set up MATLAB license
        run: |
          mkdir -p /home/runner/.matlab/R2024a_licenses
          echo "${{ secrets.MATLAB_LICENSE_FILE }}" > /home/runner/.matlab/R2024a_licenses/license.lic
          chmod 644 /home/runner/.matlab/R2024a_licenses/license.lic
          
      - name: Debug License File (Safe)
        run: |
          echo "Checking license file structure..."
          if [ -s /home/runner/.matlab/R2024a_licenses/license.lic ]; then
            echo "License file exists and is not empty."
            echo "First line (masked): $(head -n 1 /home/runner/.matlab/R2024a_licenses/license.lic | cut -c1-10)..."
            grep -E "SERVER|DAEMON|INCREMENT" /home/runner/.matlab/R2024a_licenses/license.lic | cut -d' ' -f1 | sort | uniq || echo "No standard license keywords found."
          else
            echo "ERROR: License file is empty or missing!"
          fi

      - name: Run Matlab tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: MATLAB/serc
          select-by-folder: true

      - name: Build Matlab artifacts
        uses: matlab-actions/run-command@v2
        with:
          command: |
            mkdir -p dist;
            addpath('MATLAB/serc');
            buildFundamentals;
            buildCNN;
            buildLSTM;
            buildIntegration;
            save('dist/edge_ai_models.mat');
            exportONNXNetwork(netCNN,'dist/cnn_model.onnx');
            exportONNXNetwork(netLSTM,'dist/lstm_model.onnx');
            codegen netCNN -args {ones(64,64,3,'single')} -report;
            codegen netLSTM -args {ones(100,1,'single')} -report;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-matlab
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: edge-ai-matlab
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Automated Matlab Release v${{ github.run_number }}"
          body: |
            Automated build and release of Edge-AI-APP Matlab Deep Learning modules.
          files: release/**
