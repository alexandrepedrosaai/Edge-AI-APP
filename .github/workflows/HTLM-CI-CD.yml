name: CI/CD HTML Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Build project
        run: pnpm run build
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-ai-dashboard
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-ai-dashboard
          path: release
          
      - name: Generate Unique Tag and Release Name
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          TAG="html-v${TIMESTAMP}-${SHORT_SHA}"
          RELEASE_NAME="HTML Dashboard Release ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            🚀 Automated HTML Dashboard build and release.
            
            **Release Details:**
            - **Commit:** ${{ github.sha }}
            - **Run ID:** ${{ github.run_id }}
            - **Timestamp:** $(date)
            
            This release was automatically generated for commit ${{ github.sha }} to ensure artifact isolation.
          files: release/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-ai-dashboard
          path: ./dist
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          
      - name: Add custom domain file
        run: echo "edge-ai-ml-dl-css.io" > ./dist/CNAME
        
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
