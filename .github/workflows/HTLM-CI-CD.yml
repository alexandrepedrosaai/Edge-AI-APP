name: CI/CD HTML Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - run: mkdir -p artifacts && cp -r dist/* artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: edge-ai-dashboard
          path: artifacts

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edge-ai-dashboard
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Automated Release v${{ github.run_number }}"
          body: "Automated build and release of Edge-AI-APP Dashboard"
          files: release/**

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Add custom domain file
        run: echo "edge-ai-ml-dl-css.io" > ./dist/CNAME
      - uses: actions/deploy-pages@v4
