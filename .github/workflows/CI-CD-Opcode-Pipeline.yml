name: CI-CD Opcode Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-opcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm binutils gcc checksec

      - name: Compile high-level code
        run: |
          make build
          echo "Compilando pacotes em linguagens de alto nível..."

      - name: Generate Opcode artifacts
        run: |
          mkdir -p artifacts
          # Usando ferramentas do Makefile.asm para gerar artefatos
          cp -r build/bin artifacts/ || true
          cp build/logs/build-report.txt artifacts/ || echo "Build report not found" > artifacts/error.log
          
          # Caso as ferramentas ./tools existam no futuro, o workflow estará pronto
          if [ -d "./tools" ]; then
            ./tools/opcode-generator --input ./build --output ./artifacts/opcode || true
            ./tools/hex-dumper ./build/bin > ./artifacts/hex_dump.hex || true
            ./tools/bin-encoder ./build/bin > ./artifacts/machine_code.bin || true
          fi

      - name: Run ISA simulation tests
        run: |
          echo "Executando testes de simulação ISA..."
          # Simulação dummy se os simuladores não existirem
          if [ -d "./simulators" ]; then
            ./simulators/cpu6502 --load ./artifacts/opcode || true
            ./simulators/jvm --bytecode ./artifacts/bytecode.class || true
          else
            echo "Simuladores não encontrados, pulando testes reais."
          fi

      - name: Package artifacts
        run: |
          tar -czf release_${{ github.sha }}.tar.gz ./artifacts
          echo "Pacote de release criado com Opcode, HEX e Binary."

      - name: Publish release
        uses: actions/upload-artifact@v4
        with:
          name: opcode-release
          path: release_${{ github.sha }}.tar.gz

  deploy:
    needs: build-opcode
    runs-on: ubuntu-latest
    if: false # Desativado temporariamente até configurar Azure
    steps:
      - name: Deploy to Azure Artifacts
        run: |
          echo "Deploy para Azure desativado."
          # az artifacts universal publish \
          #   --organization "https://dev.azure.com/yourorg" \
          #   --feed "EdgeAIApp" \
          #   --package-name "opcode-release" \
          #   --package-version "1.0.${{ github.run_number }}" \
          #   --path release_${{ github.sha }}.tar.gz
