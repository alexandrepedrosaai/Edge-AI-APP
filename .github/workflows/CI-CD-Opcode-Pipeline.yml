name: CI-CD Opcode Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-opcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Compile high-level code
        run: |
          make build
          echo "Compilando pacotes em linguagens de alto nível..."

      - name: Generate Opcode artifacts
        run: |
          ./tools/opcode-generator --input ./build --output ./artifacts/opcode
          ./tools/hex-dumper ./build/bin > ./artifacts/hex_dump.hex
          ./tools/bin-encoder ./build/bin > ./artifacts/machine_code.bin

      - name: Run ISA simulation tests
        run: |
          ./simulators/cpu6502 --load ./artifacts/opcode
          ./simulators/jvm --bytecode ./artifacts/bytecode.class

      - name: Package artifacts
        run: |
          tar -czf release_${{ github.sha }}.tar.gz ./artifacts
          echo "Pacote de release criado com Opcode, HEX e Binary."

      - name: Publish release
        uses: actions/upload-artifact@v3
        with:
          name: opcode-release
          path: release_${{ github.sha }}.tar.gz

  deploy:
    needs: build-opcode
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure Artifacts
        run: |
          az artifacts universal publish \
            --organization "https://dev.azure.com/yourorg" \
            --feed "EdgeAIApp" \
            --package-name "opcode-release" \
            --package-version "1.0.${{ github.run_number }}" \
            --path release_${{ github.sha }}.tar.gz
