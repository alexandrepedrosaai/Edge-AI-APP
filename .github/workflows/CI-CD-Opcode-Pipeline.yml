name: CI-CD Opcode Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build-opcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm binutils gcc checksec

      - name: Compile high-level code
        run: |
          make build
          echo "Compilando pacotes em linguagens de alto nível..."

      - name: Generate Opcode artifacts
        run: |
          mkdir -p artifacts
          # Copiar binários gerados pelo Makefile.asm
          cp -r build/bin/* artifacts/ 2>/dev/null || echo "Nenhum binário encontrado para copiar"
          cp build/logs/build-report.txt artifacts/ 2>/dev/null || echo "Relatório de build não encontrado"
          
          if [ -d "./tools" ]; then
            ./tools/opcode-generator --input ./build --output ./artifacts/opcode || true
          fi

      - name: Package artifacts
        run: |
          tar -czf release_opcode_${{ github.run_number }}.tar.gz ./artifacts
          echo "Pacote de release criado: release_opcode_${{ github.run_number }}.tar.gz"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opcode-build-artifact
          path: release_opcode_${{ github.run_number }}.tar.gz

  deploy-release:
    needs: build-opcode
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: opcode-build-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }} - Opcode Pipeline
          body: |
            Automatic Release generated by CI-CD Opcode Pipeline.
            
            **Commit:** ${{ github.sha }}
            **Run Number:** ${{ github.run_number }}
            
            ### Artifacts:
            - `release_opcode_${{ github.run_number }}.tar.gz`: Contém os binários compilados e o relatório de build.
          files: release_opcode_${{ github.run_number }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
