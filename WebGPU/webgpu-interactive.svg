<svg width="1536" height="1024" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Background Image -->
  <image xlink:href="webgpu-bg.jpg" width="1536" height="1024" />
  
  <defs>
    <filter id="ultraNeon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="ionGlowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Magnetic Field Lines (B-Field) - Ultra Thick and Vibrant Cyan/Blue -->
  <g stroke="#00f7ff" stroke-width="10" fill="none" opacity="0.9" filter="url(#ultraNeon)">
    <path d="M768,400 Q1100,0 1400,400" stroke-dasharray="30,20">
      <animate attributeName="stroke-dashoffset" from="500" to="0" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M768,400 Q436,0 136,400" stroke-dasharray="30,20">
      <animate attributeName="stroke-dashoffset" from="0" to="500" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M768,400 Q1100,800 1400,400" stroke-dasharray="30,20">
      <animate attributeName="stroke-dashoffset" from="500" to="0" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M768,400 Q436,800 136,400" stroke-dasharray="30,20">
      <animate attributeName="stroke-dashoffset" from="0" to="500" dur="2s" repeatCount="indefinite" />
    </path>
    <!-- Vertical Flux -->
    <path d="M768,400 Q600,400 768,0" stroke-dasharray="30,20">
      <animate attributeName="stroke-dashoffset" from="0" to="500" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M768,400 Q936,400 768,800" stroke-dasharray="30,20">
      <animate attributeName="stroke-dashoffset" from="500" to="0" dur="1.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Flowing Ions - Neon Green - Coming from ALL directions -->
  <g filter="url(#ionGlowStrong)">
    <!-- From Top Left -->
    <circle r="12" fill="#00ff00">
      <animateMotion dur="1.2s" repeatCount="indefinite" path="M0,0 L768,400" />
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <!-- From Top Right -->
    <circle r="12" fill="#00ff00">
      <animateMotion dur="1.4s" repeatCount="indefinite" path="M1536,0 L768,400" begin="0.2s" />
      <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <!-- From Bottom Left -->
    <circle r="12" fill="#00ff00">
      <animateMotion dur="1.1s" repeatCount="indefinite" path="M0,1024 L768,400" begin="0.4s" />
      <animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <!-- From Bottom Right -->
    <circle r="12" fill="#00ff00">
      <animateMotion dur="1.3s" repeatCount="indefinite" path="M1536,1024 L768,400" begin="0.6s" />
      <animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite" />
    </circle>
    <!-- From Left Center -->
    <circle r="10" fill="#00ff00">
      <animateMotion dur="1s" repeatCount="indefinite" path="M0,512 L768,400" begin="0.1s" />
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
    </circle>
    <!-- From Right Center -->
    <circle r="10" fill="#00ff00">
      <animateMotion dur="1.5s" repeatCount="indefinite" path="M1536,512 L768,400" begin="0.3s" />
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <!-- From Top Center -->
    <circle r="10" fill="#00ff00">
      <animateMotion dur="0.9s" repeatCount="indefinite" path="M768,0 L768,400" begin="0.5s" />
      <animate attributeName="opacity" values="0;1;0" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <!-- From Bottom Center -->
    <circle r="10" fill="#00ff00">
      <animateMotion dur="1.6s" repeatCount="indefinite" path="M768,1024 L768,400" begin="0.7s" />
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- High Energy Labels -->
  <text x="768" y="100" fill="#00f7ff" font-family="Arial" font-size="40" text-anchor="middle" font-weight="bold" filter="url(#ultraNeon)">MAXIMUM MAGNETIC FLUX</text>
  <text x="768" y="950" fill="#00ff00" font-family="Arial" font-size="40" text-anchor="middle" font-weight="bold" filter="url(#ionGlowStrong)">OMNIDIRECTIONAL ION STORM</text>
</svg>
