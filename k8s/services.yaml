apiVersion: v1
kind: Service
metadata:
  name: edge-frontend-service
  labels:
    app.kubernetes.io/name: edge-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: edge-ai-app
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app: edge-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: edge-backend-service
  labels:
    app.kubernetes.io/name: edge-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: edge-ai-app
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app: edge-backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: edge-python-service
  labels:
    app.kubernetes.io/name: edge-python
    app.kubernetes.io/component: ml-inference
    app.kubernetes.io/part-of: edge-ai-app
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app: edge-python
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
  type: ClusterIP
