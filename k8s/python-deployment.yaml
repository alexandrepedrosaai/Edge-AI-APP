apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-python
  labels:
    app.kubernetes.io/name: edge-python
    app.kubernetes.io/component: ml-inference
    app.kubernetes.io/part-of: edge-ai-app
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: edge-python
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: edge-python
        app.kubernetes.io/name: edge-python
        app.kubernetes.io/component: ml-inference
        app.kubernetes.io/part-of: edge-ai-app
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: python
          # TODO: replace :latest with an immutable digest tag (e.g. sha256:...) for production stability
          image: alexandrepedrosaai/edge-python:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem is not set here because Python/ML workloads often write
            # temp files, model caches, or bytecode; enable once confirmed safe for this image
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
