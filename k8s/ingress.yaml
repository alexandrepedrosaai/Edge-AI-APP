apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: edge-ai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge-frontend-service
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: edge-backend-service
                port:
                  number: 4000
          - path: /python
            pathType: Prefix
            backend:
              service:
                name: edge-python-service
                port:
                  number: 5000
