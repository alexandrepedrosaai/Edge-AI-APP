[package]
name = "edge-ai-app"
version = "0.1.0"
edition = "2021"
authors = ["Alexandre Pedrosa <alexandre@example.com>"]
license = "MIT"
description = "Edge AI App - Rust core modules for orchestration and performance"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
anyhow = "1.0"
thiserror = "1.0"

# AI/ML integration (lightweight)
ndarray = "0.15"
linfa = "0.7"   # classical ML algorithms in Rust

[dev-dependencies]
criterion = "0.5"   # benchmarking
